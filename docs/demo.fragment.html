<title>Agent Fleet 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
:root {
  --sky: #0f2236;
  --sky-deep: #0a1828;
  --panel: #15304b;
  --panel-2: #1b3a59;
  --line: rgba(143, 179, 217, 0.22);
  --line-strong: rgba(143, 179, 217, 0.45);
  --ink: #e8eff7;
  --ink-2: #a9bdd3;
  --ink-3: #7690ad;
  --running: #f2b33d;
  --thinking: #7fd1c7;
  --waiting: #e58ac0;
  --error: #f2665c;
  --idle: #6f86a3;
  --focus: #ffd98a;
  --font-ui: 'Barlow', system-ui, sans-serif;
  --font-head: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
  --font-code: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --sky: #e9f0f7;
    --sky-deep: #dde7f1;
    --panel: #f6f9fc;
    --panel-2: #ffffff;
    --line: rgba(29, 53, 87, 0.16);
    --line-strong: rgba(29, 53, 87, 0.35);
    --ink: #142a44;
    --ink-2: #3c5774;
    --ink-3: #647d99;
    --running: #c98500;
    --thinking: #138a7d;
    --waiting: #b8448a;
    --error: #d1453b;
    --idle: #7a8ea6;
    --focus: #b36b00;
    color-scheme: light;
  }
}
:root[data-theme='light'] {
  --sky: #e9f0f7;
  --sky-deep: #dde7f1;
  --panel: #f6f9fc;
  --panel-2: #ffffff;
  --line: rgba(29, 53, 87, 0.16);
  --line-strong: rgba(29, 53, 87, 0.35);
  --ink: #142a44;
  --ink-2: #3c5774;
  --ink-3: #647d99;
  --running: #c98500;
  --thinking: #138a7d;
  --waiting: #b8448a;
  --error: #d1453b;
  --idle: #7a8ea6;
  --focus: #b36b00;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- project column ---------- */
.projects {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.projects header { padding: 20px 20px 12px; }
.brand { font: 600 21px/1.1 var(--font-head); letter-spacing: 0.01em; margin: 0; }
.brand small { display: block; font: 400 13px/1.4 var(--font-ui); color: var(--ink-3); margin-top: 4px; }
.filter {
  margin-top: 14px;
  width: 100%;
  background: var(--sky-deep);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--ink);
  font: inherit;
}
.filter::placeholder { color: var(--ink-3); }
.project-list { list-style: none; margin: 0; padding: 4px 10px 16px; overflow-y: auto; flex: 1; }
.project {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 8px;
  padding: 11px 12px 11px 14px;
  cursor: pointer;
  position: relative;
  display: grid;
  gap: 3px;
}
.project:hover { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.project[aria-current='true'] { background: var(--panel-2); }
.project[aria-current='true']::before {
  content: '';
  position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px;
  border-radius: 2px;
  background: var(--running);
}
.project .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.project .name { font: 600 16px/1.2 var(--font-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.project .step { font: 12px/1.35 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 5px; align-items: center; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.dot.sub { width: 5px; height: 5px; }
.dot.running { background: var(--running); box-shadow: 0 0 8px var(--running); }
.dot.thinking { background: var(--thinking); }
.dot.waiting { background: var(--waiting); }
.dot.error { background: var(--error); }
.dots .count { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.empty { padding: 18px 20px; color: var(--ink-2); font-size: 14px; }
.empty button, .linkish {
  background: none; border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 7px 12px; margin-top: 12px; cursor: pointer;
}
.projects footer {
  border-top: 1px solid var(--line);
  padding: 12px 20px 16px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.projects footer strong { color: var(--ink-2); font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.conn.live::before { background: var(--thinking); }
.conn.demo::before { background: var(--waiting); }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; }
#scene, .scene-host { position: absolute; inset: 0; }
#scene canvas { display: block; }
.overlay { position: absolute; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.title { top: 20px; left: 24px; max-width: 50%; }
.title h2 { margin: 0; font: 600 30px/1.1 var(--font-head); }
.title p { margin: 4px 0 0; font: 12.5px var(--font-code); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--ink-2);
  background: color-mix(in srgb, var(--sky) 70%, transparent);
}
.chip b { font-weight: 600; color: var(--ink); }
.chip.running { border-color: var(--running); }
.chip.waiting { border-color: var(--waiting); }
.chip.error { border-color: var(--error); }


.legend {
  bottom: 18px; left: 24px;
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-2);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.placeholder {
  inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2);
  pointer-events: none;
}
.placeholder p { max-width: 34ch; margin: 0; }


/* ---------- drawer ---------- */
.drawer {
  position: absolute; top: 76px; right: 24px; bottom: 18px;
  width: 330px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; flex-direction: column;
  min-height: 0;
  backdrop-filter: blur(6px);
}
.drawer h3 { margin: 0; font: 600 17px/1.2 var(--font-head); }
.drawer .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.drawer .head p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.drawer .body { overflow-y: auto; padding: 8px 8px 14px; flex: 1; }
.agents { list-style: none; margin: 0; padding: 0; }
.agent-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center;
}
.agent-btn:hover { background: var(--panel-2); }
.agent-btn .dot { grid-row: span 2; }
.agent-btn .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn .s { font: 12px var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn.sub { padding-left: 26px; }
.back { background: none; border: 0; padding: 0 0 6px; color: var(--ink-3); cursor: pointer; font-size: 13px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 8px 6px; font-size: 13px; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0 8px; position: relative; }
.timeline li { position: relative; padding: 6px 0 6px 18px; border-left: 1px solid var(--line); }
.timeline li::before {
  content: ''; position: absolute; left: -4px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--idle);
}
.timeline li.running::before { background: var(--running); box-shadow: 0 0 8px var(--running); }
.timeline li.error::before { background: var(--error); }
.timeline li.done::before { background: var(--thinking); }
.timeline .t { font: 12px/1.35 var(--font-code); overflow-wrap: anywhere; }
.timeline .m { font-size: 11.5px; color: var(--ink-3); }
.timeline .err { color: var(--error); font-size: 12px; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; }
  .projects { border-right: 0; border-bottom: 1px solid var(--line); }
  .projects footer { display: none; }
  .drawer { top: auto; left: 16px; right: 16px; width: auto; height: 40%; }
  .title { left: 16px; max-width: 70%; }
  .title h2 { font-size: 22px; }
  .recenter { right: 16px; }
  .legend { display: none; }
}

[hidden] { display: none !important; }
#scene, .scene-host { z-index: 0; isolation: isolate; }
.overlay { z-index: 2; }

/* ---------- pipeline bar (project list + drawer) ---------- */
.pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 2px; }
.pipe .seg { display: grid; gap: 3px; font-size: 11px; color: var(--ink-3); min-width: 0; }
.pipe .seg i { display: block; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--idle) 45%, transparent); }
.pipe .seg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe .seg.active i { background: var(--running); box-shadow: 0 0 6px var(--running); }
.pipe .seg.active span { color: var(--ink); font-weight: 600; }
.pipe .seg.done i { background: var(--thinking); }
.pipe .seg.failed i { background: var(--error); }
.pipe .seg.stale i { background: var(--idle); }
.pstatus { font-size: 12.5px; color: var(--ink-2); }
.pstatus.blocked { color: var(--error); }
.pstatus.complete { color: var(--thinking); }

/* ---------- labels in the 3D flow ---------- */
.fcard {
  font: 12px/1.3 var(--font-ui);
  color: var(--ink);
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  border: 1px solid var(--line-strong);
  border-top: 3px solid var(--idle);
  border-radius: 7px;
  padding: 5px 9px 6px;
  max-width: 168px;
  text-align: center;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
  margin-bottom: 6px;
}
.fcard .n { font: 600 13.5px/1.2 var(--font-head); }
.fcard .t { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.fcard .s { font: 11.5px/1.3 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.fcard .m { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.fcard.quiet { opacity: 0.72; padding: 3px 8px; }
.fcard.quiet .n { font-size: 12px; }
.fcard.stage.active { border-top-color: var(--running); }
.fcard.stage.active.waiting { border-top-color: var(--waiting); }
.fcard.stage.active.error { border-top-color: var(--error); }
.fcard.stage.done, .fcard.git.done { border-top-color: var(--thinking); }
.fcard.stage.failed { border-top-color: var(--error); }
.fcard.origin { border-top-color: var(--focus); margin: 6px 0 0; }
.fcard.git { margin: 6px 0 0; }
.fcard.origin.waiting { border-top-color: var(--waiting); }
.fcard.git { cursor: default; }
.fcard.rework { border-top-color: var(--waiting); cursor: default; font-size: 11.5px; }
.fcard.rework.hot { border-top-color: var(--error); }
.fcard.sel { border-color: var(--ink); }

.top-actions { top: 20px; right: 24px; display: flex; gap: 8px; align-items: center; }
.views { display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: color-mix(in srgb, var(--panel) 85%, transparent); }
.views button { background: none; border: 0; padding: 7px 14px; cursor: pointer; color: var(--ink-2); }
.views button[aria-pressed='true'] { background: var(--panel-2); color: var(--ink); font-weight: 600; }
.recenter {
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; color: var(--ink-2);
}
.recenter:hover { color: var(--ink); }

/* ---------- drawer: flows and stages ---------- */
.flow { border: 1px solid var(--line); border-radius: 9px; padding: 8px; margin: 6px 4px 10px; }
.flow.focus { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.flow-head { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: none; border: 0; padding: 2px 4px; cursor: pointer; text-align: left; }
.flow-head .n { font: 600 15px/1.2 var(--font-head); }
.flow .task { margin: 2px 4px 6px; font-size: 13px; color: var(--ink-2); }
.hint { margin: 4px 4px; font-size: 12.5px; color: var(--ink-3); }
.hint.pad, .sub-h.pad { margin: 10px 12px; }
.sub-h { margin: 10px 4px 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: st; }
.stage-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; cursor: pointer;
  padding: 6px 8px; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
}
.stage-btn:hover { background: var(--panel-2); }
.stage-btn .dot { background: var(--idle); opacity: .55; }
.stage-btn.active .dot { background: var(--running); box-shadow: 0 0 8px var(--running); opacity: 1; }
.stage-btn.done .dot { background: var(--thinking); opacity: 1; }
.stage-btn.failed .dot { background: var(--error); opacity: 1; }
.stage-btn .n { font-weight: 600; font-size: 14px; }
.stage-btn.pending .n { color: var(--ink-3); font-weight: 500; }
.stage-btn .m { font-size: 12px; color: var(--ink-3); text-align: right; max-width: 150px; }
.stage-btn .s { grid-column: 2 / -1; font: 12px var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-btn .s.fail { color: var(--error); }
.stage-btn .s.pass { color: var(--thinking); }

/* ---------- chat list ---------- */
.list-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.list-tools label { display: grid; gap: 3px; font-size: 12px; color: var(--ink-3); }
.list-tools select {
  font: inherit; font-size: 13.5px; color: var(--ink); background: var(--sky-deep);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0;
}
.chat-list { overflow-y: auto; flex: 1; padding: 2px 10px 16px; }
.group { margin-top: 6px; }
.group-h {
  width: 100%; display: flex; align-items: center; gap: 6px; background: none; border: 0; cursor: pointer;
  padding: 8px 6px 4px; color: var(--ink-3); font-size: 12.5px; font-weight: 600; text-align: left;
  position: sticky; top: 0; background: var(--panel); z-index: 1;
}
.group-h .chev { width: 12px; font-size: 11px; }
.group-h .gname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.group-h .gcount { font-weight: 500; font-variant-numeric: tabular-nums; }
.chat-ul { list-style: none; margin: 0; padding: 0; }
.chat {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; cursor: pointer;
  padding: 8px 10px 8px 12px; display: grid; gap: 3px; position: relative;
}
.chat > *, .chat .row > *, .cmeta > * { min-width: 0; }
.chat .row .name { flex: 1; }
.chat:hover { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.chat[aria-current='true'] { background: var(--panel-2); }
.chat[aria-current='true']::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 2px; background: var(--focus); }
.chat .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.chat .name { font: 500 14.5px/1.25 var(--font-ui); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cmeta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); min-width: 0; }
.cmeta .proj { color: var(--ink-2); }
.cmeta .branch { font-family: var(--font-code); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmeta .counts { margin-left: auto; white-space: nowrap; }
.chat .step { font: 12px/1.35 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat .pipe { margin-top: 1px; }
.chat .pipe .seg span { font-size: 10.5px; }

/* ---------- history drawer ---------- */
.skills { font-size: 12px; color: var(--ink-3); }
.turns { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.turn-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; cursor: pointer;
  padding: 7px 8px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 1px 8px; align-items: baseline;
}
.turn-btn:hover { background: var(--panel-2); }
.turn-btn.on { background: var(--panel-2); }
.turn-btn .tn { grid-row: span 2; font: 600 12.5px var(--font-code); color: var(--focus); text-align: right; font-variant-numeric: tabular-nums; }
.turn-btn .tp { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn-btn.on .tp { white-space: normal; font-weight: 600; }
.turn-btn .tm { font-size: 11.5px; color: var(--ink-3); }
.turn-detail { margin: 2px 4px 10px 34px; }
.turn-detail .full-prompt { margin: 4px 0 6px; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.turn-detail .reply { margin: 2px 0 6px; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
.turn-detail .timeline { padding: 0 2px; }
.agent-row { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 1px 10px; align-items: center; padding: 4px 2px; }
.agent-row .dot { grid-column: 1; grid-row: 1 / span 4; align-self: start; margin-top: 5px; }
.agent-row > :not(.dot) { grid-column: 2; }
.agent-row .n { font-weight: 600; font-size: 13.5px; }
.agent-row .s { font: 12px var(--font-code); color: var(--ink-2); overflow-wrap: anywhere; }
.agent-row .s.fail { color: var(--error); }
.agent-row .s.pass { color: var(--thinking); }
.agent-row .m { font-size: 11.5px; color: var(--ink-3); }
.flow-head.static { cursor: default; }
.fcard.hist { max-width: 240px; white-space: normal; text-align: left; }
.fcard.hist .t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ---------- hover tooltip ---------- */
.tip {
  max-width: 270px; pointer-events: none !important; z-index: 5;
  background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--line-strong);
  border-radius: 7px; padding: 6px 9px; display: grid; gap: 2px; font-size: 12px; color: var(--ink-2);
}
.tip b { font: 600 12.5px/1.3 var(--font-code); color: var(--ink); overflow-wrap: anywhere; }
.tip .err { color: var(--error); }

</style>

    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
<aside class="projects" aria-label="Chats">
    <header>
      <h1 class="brand">Agent Fleet<small>Seus chats do Claude Code em 3D</small></h1>
      <input class="filter" id="filter" type="search" placeholder="Buscar chats" aria-label="Buscar chats" />
      <div class="list-tools">
        <label>Agrupar
          <select id="group">
            <option value="date">Por data</option>
            <option value="project">Por projeto</option>
            <option value="none">Sem grupos</option>
          </select>
        </label>
        <label>Mostrar
          <select id="show">
            <option value="all">Todos</option>
            <option value="active">Ativos agora</option>
            <option value="pipeline">Com pipeline</option>
            <option value="plain">Sem pipeline</option>
            <option value="errors">Com erros</option>
          </select>
        </label>
      </div>
    </header>
    <div class="chat-list" id="chats"></div>
    <footer>
      <div><span class="conn" id="conn">Conectando…</span> <span id="count"></span></div>
      <div id="router-stats" style="margin-top:6px"></div>
    </footer>

function effectiveStatus(a, now) {

const LIVE = new Set(['running', 'thinking', 'waiting', 'error', 'ready']);

// ---------------------------------------------------------------------------
// Pipeline runs, derived from the stage subagents of each main session.
function runsOf(pr, sid) {

      cur = { started: a.started, stages: { plan: [], build: [], test: [], ship: [] }, pastPlan: false, shipped: false };
      runs.push(cur);

    cur.stages[a.stage].push(a);

function summarizeRun(run, now, index) {

      label: def.label,
      verb: def.verb,
      status,
      agentId: last.id,
      agentStatus: ast,
      step: last.step,
      skill: last.skill,
      verdict: last.verdict,
      result: last.result,
      attempts: attempts.length,
      started: first.started,
      ended: status === 'done' || status === 'failed' ? last.ended || last.last : null,
      dur: (status === 'active' ? now : last.ended || last.last) - first.started,
      tools: attempts.reduce((n, a) => n + a.tools, 0),
      errors: attempts.reduce((n, a) => n + a.errors, 0),
      steps: last.steps.slice(-8).map(({ tool, step, st, dur }) => ({ tool, step, st, dur })),

function flowsOf(pr, now) {
  const mains = [...pr.agents.values()].filter((a) => a.kind === 'main' && (a.status !== 'ended' || now - a.last < ACTIVE_WINDOW_MS));

    .map((m) => {

      const run = runs.length ? summarizeRun(runs[runs.length - 1], now, runs.length - 1) : null;
      const others = [...pr.agents.values()].filter((a) => a.parent === m.id && !a.stage);
      return {
        sid: m.id,
        label: m.label,
        status: effectiveStatus(m, now),
        step: m.step,
        skill: m.skill,
        last: m.last,
        started: m.started,
        runs: runs.length,
        completed: runs.filter((r) => r.shipped).length,
        run,
        others: others.filter((a) => effectiveStatus(a, now) !== 'done' || now - a.last < SUB_LINGER_MS).map((a) => a.id),

function listProjects(state, now = Date.now(), { includeInactive = false } = {}) {

function glowTexture() {

  c.width = c.height = 128;

  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function category(tool = '') {

}

      s += GAP.turn * 0.3;
    }
    const length = Math.max(s, 4);
    const rows = Math.floor(length / ROW_W) + 1;

    // conveyor: straight segments + U-turns
    const beltMat = new THREE.MeshStandardMaterial({ color: pal['ink-3'], roughness: 0.6, transparent: true, opacity: light ? 0.55 : 0.45 });
    for (let r = 0; r < rows; r++) {
      const segLen = Math.min(ROW_W, length - r * ROW_W);
      if (segLen <= 0) break;
      const a = posAt(r * ROW_W);
      const b = posAt(r * ROW_W + segLen - 0.001);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(a.clone().setY(-0.12), b.clone().setY(-0.12)), 8, 0.06, 6, false), beltMat);
      root.add(tube);
      if (r < rows - 1 && segLen >= ROW_W - 0.01) {
        const end = posAt(r * ROW_W + ROW_W - 0.001);
        const side = r % 2 === 0 ? 1 : -1;
        const pts = [];
        for (let k = 0; k <= 16; k++) {
          const ang = (k / 16) * Math.PI;
          pts.push(new THREE.Vector3(end.x + side * Math.sin(ang) * (ROW_GAP / 2), -0.12, end.z - ROW_GAP / 2 + Math.cos(ang) * (ROW_GAP / 2)));
        }
        root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, 0.06, 6, false), beltMat));
      }
    }
    // faint floor under the whole path
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(ROW_W + 10, rows * ROW_GAP + 6),
      new THREE.MeshBasicMaterial({ color: pal.panel, transparent: true, opacity: light ? 0.55 : 0.35 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, -0.5, -((rows - 1) * ROW_GAP) / 2);
    root.add(floor);

    // tools as one instanced mesh
    const toolItems = items.filter((i) => i.kind === 'tool');
    const tools = new THREE.InstancedMesh(geo.tool, new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.1 }), Math.max(1, toolItems.length));
    tools.count = toolItems.length;
    const m4 = new THREE.Matrix4();
    toolItems.forEach((it, k) => {
      const p = posAt(it.s);
      m4.makeTranslation(p.x, 0.12, p.z);
      tools.setMatrixAt(k, m4);
      tools.setColorAt(k, catColor(it.ref.cat, it.ref.err));
      it.index = k;
    });
    if (tools.instanceColor) tools.instanceColor.needsUpdate = true;
    tools.userData.items = toolItems;
    root.add(tools);

    // turn gates
    const gates = [];
    const turnItems = items.filter((i) => i.kind === 'turn');
    for (const it of turnItems) {
      const p = posAt(it.s);
      const g = new THREE.Group();
      g.position.copy(p);
      const ring = new THREE.Mesh(geo.gate, new THREE.MeshStandardMaterial({ color: pal.focus, emissive: pal.focus, emissiveIntensity: 0.35, roughness: 0.3 }));
      ring.position.y = 0.55;
      ring.rotation.y = Math.PI / 2;
      const core = new THREE.Mesh(geo.gateCore, new THREE.MeshStandardMaterial({ color: pal.focus, emissive: pal.focus, emissiveIntensity: 0.5 }));
      core.position.y = 0.55;
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false, color: pal.focus, opacity: 0 }));
      halo.scale.setScalar(2.6);
      halo.position.y = 0.55;
      g.add(ring, core, halo);
      for (const m of [ring, core]) m.userData.pick = { kind: 'turn', turn: it.turn };
      root.add(g);
      gates.push({ g, ring, core, halo, it });
    }

    // agents: branch off the belt toward the camera
    const agents = [];
    for (const it of items.filter((i) => i.kind === 'agent')) {
      const a = it.ref;
      const p = posAt(it.s);
      const node = new THREE.Vector3(p.x, 0.35, p.z + 2.1);
      const color = a.stage
        ? a.verdict === 'fail' || a.err
          ? pal.error
          : a.end || !a.live
            ? pal.thinking
            : pal.running
        : a.err
          ? pal.error
          : pal.ink;
      const arm = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3([p.clone().setY(-0.12), new THREE.Vector3(p.x, -0.12, p.z + 1.2), node.clone().setY(-0.12)]), 10, 0.04, 6, false),
        new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 })
      );
      root.add(arm);
      const pad = new THREE.Mesh(geo.pad, new THREE.MeshStandardMaterial({ color: pal.panel, roughness: 0.8, transparent: true, opacity: 0.9 }));
      pad.position.set(node.x, -0.42, node.z);
      root.add(pad);
      const shape = new THREE.Mesh(a.stage ? geo[a.stage] : geo.agent, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.4, roughness: 0.35 }));
      shape.position.copy(node);
      shape.userData.pick = { kind: 'agent', agent: a, turn: it.turn };
      root.add(shape);
      // its own steps as a short line of mini cubes
      const n = Math.min(a.tools.length, 14);
      for (let k = 0; k < n; k++) {
        const tl = a.tools[a.tools.length - n + k];
        const c = new THREE.Mesh(geo.mini, new THREE.MeshStandardMaterial({ color: catColor(tl.cat, tl.err), roughness: 0.5 }));
        c.position.set(node.x + (k - (n - 1) / 2) * 0.23, -0.28, node.z + 0.95);
        root.add(c);
      }
      let lab = null;
      if (a.stage) {
        lab = label(`stage ${a.verdict === 'fail' ? 'failed' : a.end ? 'done' : 'active'} quiet`, [['n', STAGE_LABEL[a.stage]]]);
        lab.o.position.set(node.x, node.y + 0.75, node.z);
        root.add(lab.o);
      }
      agents.push({ shape, it, lab });
    }

    // labels: first prompt, last prompt and the selected one (others on hover)
    const turnLabel = label('origin focus hist', []);
    root.add(turnLabel.o);
    const nowLabel = label('stage active quiet', [['n', 'agora']]);
    root.add(nowLabel.o);
    nowLabel.o.visible = false;
    const tail = posAt(length - 0.3);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 18, 12), new THREE.MeshStandardMaterial({ color: pal.running, emissive: pal.running, emissiveIntensity: 0.8 }));
    head.position.set(tail.x, 0.12, tail.z);
    head.visible = isLive;
    root.add(head);
    nowLabel.o.position.set(tail.x, 0.9, tail.z);
    nowLabel.o.visible = isLive;

    model = { id: h.meta.id, items, gates, agents, tools, turnLabel, head, length, rows, count: items.length, firstTurn: keepFrom };
    const pickables = [tools, ...gates.flatMap((g) => [g.ring, g.core]), ...agents.map((a) => a.shape)];
    model.pickables = pickables;
    if (selectedTurn != null && !turnItems.some((x) => x.turn.n === selectedTurn)) selectedTurn = null;
    applySelection();
    if (!sameChat) frame();
    else if (prevCount !== model.count && isLive) {
      /* keep the camera where the user left it while the chat grows */
    }
  }

  function applySelection() {
    if (!model) return;
    const sel = selectedTurn ?? model.gates[model.gates.length - 1]?.it.turn.n;
    for (const g of model.gates) {
      const on = g.it.turn.n === sel;
      g.halo.material.opacity = on ? (light ? 0.5 : 0.8) : 0;
      g.g.scale.setScalar(on ? 1.25 : 1);
    }
    const gate = model.gates.find((g) => g.it.turn.n === sel);
    const tl = model.turnLabel;
    tl.card.replaceChildren();
    if (gate) {
      const t = gate.it.turn;
      tl.card.appendChild(el('div', 'n', `Prompt ${t.n + 1}`));
      tl.card.appendChild(el('div', 't', t.prompt ? t.prompt.slice(0, 90) : '(início da sessão)'));
      tl.card.appendChild(el('div', 'm', `${t.tools.length} ferramenta${t.tools.length === 1 ? '' : 's'}${t.agents.length ? `, ${t.agents.length} subagente${t.agents.length > 1 ? 's' : ''}` : ''}`));
      tl.o.position.set(gate.g.position.x, 1.5, gate.g.position.z);
      tl.o.visible = true;
    } else tl.o.visible = false;
  }

  function selectTurn(n) {
    selectedTurn = n;
    applySelection();
  }

  // ------------------------------------------------------------ camera
  let fly = null;
  let rightInset = 0;
  function frame() {
    if (!model) return;
    const { clientWidth: w, clientHeight: h } = host;
    const visibleW = Math.max(200, w - (w > 900 ? rightInset : 0));
    const aspect = visibleW / Math.max(h, 1);
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    // bounds of what was actually drawn (short chats only use part of the first row)
    let minX = Infinity, maxX = -Infinity;
    for (const it of model.items) {
      const p = posAt(it.s);
      minX = Math.min(minX, p.x);
      maxX = Math.max(maxX, p.x);
    }
    if (!Number.isFinite(minX)) (minX = -2), (maxX = 2);
    if (model.rows > 1) (minX = -ROW_W / 2), (maxX = ROW_W / 2);
    const halfW = Math.max(9, (maxX - minX) / 2 + 3);
    const depth = (model.rows - 1) * ROW_GAP + 4;
    const dW = halfW / Math.tan(hfov / 2) + depth * 0.35;
    const dH = (depth * 0.6 + 4) / Math.tan(vfov / 2);
    const dist = Math.max(dW, dH, 12);
    const target = new THREE.Vector3((minX + maxX) / 2, 0, -((model.rows - 1) * ROW_GAP) / 2 + 1);
    const pos = new THREE.Vector3(target.x, dist * 0.72, target.z + dist * 0.69);
    if (reduceMotion) {
      camera.position.copy(pos);
      controls.target.copy(target);
      return;
    }
    fly = { from: camera.position.clone(), fromT: controls.target.clone(), pos, target, t0: performance.now() };
  }
  camera.position.set(0, 20, 22);

  // ------------------------------------------------------------ picking + hover
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let down = null;
  function pick(e) {
    if (!model) return null;
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(model.pickables, false)[0];
    if (!hit) return null;
    if (hit.object === model.tools) {
      const it = model.tools.userData.items[hit.instanceId];
      return it ? { kind: 'tool', tool: it.ref, turn: it.turn } : null;
    }
    return hit.object.userData.pick;
  }
  renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const p = pick(e);
    if (p?.turn) onSelectTurn?.(p.turn.n, p);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    const p = pick(e);
    renderer.domElement.style.cursor = p ? 'pointer' : '';
    const r = host.getBoundingClientRect();
    onHover?.(p, { x: e.clientX - r.left, y: e.clientY - r.top });
  });
  renderer.domElement.addEventListener('pointerleave', () => onHover?.(null));

  // ------------------------------------------------------------ loop
  function resize() {
    const { clientWidth: w, clientHeight: h } = host;
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
    camera.aspect = w / Math.max(h, 1);
    if (rightInset && w > 900) camera.setViewOffset(w, h, rightInset / 2, 0, w, h);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  function setInset(px) {
    if (px === rightInset) return;
    rightInset = px;
    resize();
    frame();
  }
  new ResizeObserver(resize).observe(host);
  resize();

  const retheme = () => {
    readPalette();
    if (model) {
      // rebuild colors cheaply by re-running layout with the same data
      const h = lastData;
      if (h) setHistory(h, { isLive: live });
    }
  };
  let lastData = null;
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  const clock = new THREE.Clock();
  let simT = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (document.hidden || !visible) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    if (!reduceMotion) simT += dt;
    if (fly) {
      const u = Math.min(1, (performance.now() - fly.t0) / 1000);
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      camera.position.lerpVectors(fly.from, fly.pos, e);
      controls.target.lerpVectors(fly.fromT, fly.target, e);
      if (u >= 1) fly = null;
    }
    if (model && !reduceMotion) {
      for (const g of model.gates) g.ring.rotation.x += dt * 0.4;
      if (model.head.visible) model.head.scale.setScalar(1 + 0.25 * Math.sin(simT * 5));
      for (const a of model.agents) if (a.it.ref.stage && !a.it.ref.end && live) a.shape.rotation.y += dt * 1.5;
    }
    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  loop();

  return {
    setHistory(h, opts) {
      lastData = h;
      setHistory(h, opts);
    },
    selectTurn,
    setInset,
    recenter: frame,
    setVisible(v) {
      visible = v;
      host.hidden = !v;
      if (v) resize();
    },
  };
}

return { createHistoryScene };

function ago(t) {
  if (!t) return '';
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 10) return 'agora';
  if (s < 60) return `há ${s}s`;
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  if (s < 86400) return `há ${Math.round(s / 3600)} h`;
  if (s < 86400 * 7) return `há ${Math.round(s / 86400)} d`;
  return new Date(t).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}
function dur(ms) {
  if (!ms || ms < 0) return '';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} min ${s % 60}s` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function el(tag, cls, text) {

}

  if (demo) return;
  clearInterval(pollTimer);

  const parsed = demoTranscripts(now).map((t) => parseTranscript(t.lines, { subagents: t.subagents }));

  startDemo((ev) => apply(state, ev), { speed: 1.2 });
  demo = { parsed, state };
  const pull = () => {
    const now = Date.now();
    const live = [];
    for (const p of listProjects(state, now)) {
      const d = projectDetail(state, p.id, now);
      for (const f of d.flows) {
        const h = historyFromLive(d, f.sid);
        if (h) live.push({ ...h.meta, live: f.status !== 'idle', status: f.status, step: f.step, _live: { pid: p.id } });
      }
    }
    ui.chats = [...live, ...parsed.map((p) => ({ ...p.meta, live: false }))];
    ui.routes = state.routes;
    render();
    if (ui.chatId && live.some((c) => c.id === ui.chatId)) setDetail(demoDetail(ui.chatId));
  };
  pull();
  setInterval(pull, 1500);

function demoDetail(id) {
  const now = Date.now();
  const p = demo.parsed.find((x) => x.meta.id === id);
  if (p) return { meta: p.meta, turns: p.turns, pipeline: p.meta.pipeline ? pipelineOf(p.events, id, now) : null, live: false };
  const c = ui.chats.find((x) => x.id === id);
  if (!c?._live) return null;
  const d = projectDetail(demo.state, c._live.pid, now);
  const h = historyFromLive(d, id);
  return h ? { ...h, pipeline: { ...d, flows: d.flows.filter((f) => f.sid === id) }, live: c.live, status: c.status } : null;
}

        if (ui.group !== 'project') meta.append(el('span', 'proj', c.project?.name || ''));
        if (c.branch) meta.append(el('span', 'branch', c.branch));
        meta.append(el('span', 'counts', `${plural(c.prompts, 'prompt', 'prompts')}${c.errors ? `, ${plural(c.errors, 'erro', 'erros')}` : ''}`));
        const parts = [row, meta];
        const st = chatStages(c);
        if (st) parts.push(pipeBar(st, true));
        if (c.live && c.step) parts.push(el('div', 'step', c.step));
        const b = button('chat', () => selectChat(c.id), ...parts);
        b.dataset.cid = c.id;
        b.setAttribute('aria-current', String(c.id === ui.chatId));
        ul.append(item(b));
        if (c.id === focusId) queueMicrotask(() => b.focus());
      }
      sec.append(ul);
    }
    box.append(sec);
  }
}

// ------------------------------------------------------------------ detail
function sigOf(d) {
  if (!d) return '';
  const last = d.turns[d.turns.length - 1];
  return [d.meta.id, d.turns.length, d.meta.tools, last?.items.length, last?.end, d.live, JSON.stringify(d.pipeline?.flows?.[0]?.run?.stages?.map((s) => s.status + s.step) || '')].join('|');
}
function setDetail(d) {
  if (!d || d.meta?.id !== ui.chatId) return;
  const sig = sigOf(d);
  if (sig === ui.detailSig) return;
  ui.detailSig = sig;
  ui.detail = d;
  history.setHistory(d, { isLive: !!d.live });
  if (d.pipeline) pipeline.setProject(d.pipeline);
  if (ui.view === 'pipeline' && !hasPipeline()) setView('history');
  renderStage();
}
const hasPipeline = () => !!ui.detail?.pipeline?.flows?.some((f) => f.run);

async function selectChat(id) {
  if (id === ui.chatId) return;
  ui.chatId = id;
  ui.detail = null;
  ui.detailSig = '';
  ui.turn = null;
  ui.sel = null;
  history.selectTurn(null);
  render();
  await refreshDetail();
}
function selectTurn(n) {
  ui.turn = n;
  history.selectTurn(n);
  renderStage();
  const li = document.querySelector(`[data-turn="${n}"]`);
  li?.scrollIntoView({ block: 'nearest' });
}
function selectStage(sel) {
  ui.sel = sel;
  const f = ui.detail?.pipeline?.flows?.[0];
  let agentId = sel?.type === 'agent' ? sel.id : null;
  if (sel?.type === 'stage') agentId = f?.run?.stages.find((s) => s.key === sel.key)?.agentId || null;
  pipeline.select(agentId);
  renderStage();
}
function setView(v) {
  ui.view = v;
  for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === v));
  history.setVisible(v === 'history');
  pipeline.setVisible(v === 'pipeline');
  $('#legend-history').hidden = v !== 'history';
  $('#legend-pipeline').hidden = v !== 'pipeline';
  $('#tip').hidden = true;
  renderStage();
}

function renderTitle(d) {
  const m = d.meta;
  $('#p-name').textContent = m.title;
  const when = m.created ? new Date(m.created).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  $('#p-root').textContent = [m.project?.root || m.cwd, m.branch ? `branch ${m.branch}` : null, when ? `início ${when}` : null].filter(Boolean).join('   ');
  const chips = $('#p-chips');
  chips.replaceChildren();
  const chip = (cls, b, text) => {
    const ch = el('span', `chip ${cls}`);
    ch.append(el('b', null, String(b)), document.createTextNode(' ' + text));
    chips.append(ch);
  };
  if (d.live) chip('running', '●', STATUS_PT[d.status] ? STATUS_PT[d.status].toLowerCase() : 'ativo agora');
  chip('', m.prompts, m.prompts === 1 ? 'prompt' : 'prompts');
  chip('', m.tools, m.tools === 1 ? 'ferramenta' : 'ferramentas');
  if (m.agents) chip('', m.agents, m.agents === 1 ? 'subagente' : 'subagentes');
  if (m.errors) chip('error', m.errors, m.errors === 1 ? 'erro' : 'erros');
  if (m.cost != null) chip('', money(m.cost), '');
}

function renderHistoryDrawer(d) {
  const head = $('#d-head');
  const body = $('#d-body');
  head.replaceChildren();
  body.replaceChildren();
  head.append(el('h3', null, 'Histórico'), el('p', null, 'Cada anel na esteira é um prompt; os cubos depois dele são as ferramentas usadas. Clique num prompt para ver os detalhes.'));
  if (d.meta.skills?.length) head.append(el('p', 'skills', `Skills usadas: ${d.meta.skills.join(', ')}`));
  const ol = el('ol', 'turns');
  const sel = ui.turn ?? d.turns[d.turns.length - 1]?.n;
  for (const t of d.turns) {
    const li = el('li');
    li.dataset.turn = t.n;
    const on = t.n === sel;
    const b = button('turn-btn' + (on ? ' on' : ''), () => selectTurn(t.n), el('span', 'tn', String(t.n + 1)), el('span', 'tp', t.prompt || '(início da sessão)'), el('span', 'tm', `${plural(t.tools.length, 'ferramenta', 'ferramentas')}${t.agents.length ? `, ${plural(t.agents.length, 'subagente', 'subagentes')}` : ''}, ${ago(t.t)}`));
    li.append(b);
    if (on) li.append(turnDetail(t));
    ol.append(li);
  }
  body.append(ol);
}

function turnDetail(t) {
  const box = el('div', 'turn-detail');
  if (t.prompt) box.append(el('p', 'full-prompt', t.prompt));
  if (t.reply) {
    box.append(el('p', 'sub-h', 'Resposta'));
    box.append(el('p', 'reply', t.reply));
  }
  if (t.agents.length) {
    box.append(el('p', 'sub-h', 'Subagentes'));
    const ul = el('ul', 'agents');
    for (const a of t.agents) {
      const name = a.stage ? STAGE_LABEL[a.stage] : a.type;
      const st = a.verdict === 'fail' || a.err ? 'error' : a.end ? 'done' : 'running';
      const b = el('div', 'agent-row');
      b.append(el('span', `dot ${st}`), el('span', 'n', name), el('span', 's', a.desc || ''));
      if (a.verdict) b.append(el('span', 's ' + a.verdict, a.verdict === 'pass' ? 'Veredito: aprovado' : 'Veredito: reprovado'));
      else if (a.result) b.append(el('span', 's', a.result));
      if (a.end && a.t) b.append(el('span', 'm', `${plural(a.tools.length, 'passo', 'passos')}, ${dur(a.end - a.t)}`));
      ul.append(item(b));
    }
    box.append(ul);
  }
  if (t.tools.length) {
    box.append(el('p', 'sub-h', 'Ferramentas'));
    const tl = el('ol', 'timeline');
    for (const s of t.tools) {
      const li = el('li', s.err ? 'error' : 'done');
      li.append(el('div', 't', s.step));
      li.append(el('div', 'm', [s.name, s.end && s.t ? `${((s.end - s.t) / 1000).toFixed(1)}s` : null].filter(Boolean).join(', ')));
      if (s.err) li.append(el('div', 'err', s.err));
      tl.append(li);
    }
    box.append(tl);
  }
  return box;
}

// ----- pipeline drawer (same content as the project flow view)
function renderPipelineDrawer(det) {
  const head = $('#d-head');
  const body = $('#d-body');
  head.replaceChildren();
  body.replaceChildren();
  const back = () => button('back', () => selectStage(null), 'Voltar ao pipeline');
  if (ui.sel?.type === 'stage') {
    const f = det.flows[0];
    const s = f?.run?.stages.find((x) => x.key === ui.sel.key);
    const def = STAGES.find((x) => x.key === ui.sel.key);
    head.append(back(), el('h3', null, def.label), el('p', null, `${def.verb}. ${s ? STAGE_PT[s.status] : 'Aguardando'}${s?.dur && s.status !== 'pending' ? `, ${dur(s.dur)}` : ''}.`));
    const a = s?.agentId && det.agents.find((x) => x.id === s.agentId);
    if (!a) return body.append(el('p', 'hint pad', 'Esta etapa ainda não começou.'));
    if (s.history?.length > 1) {
      body.append(el('p', 'sub-h pad', 'Tentativas'));
      const ul = el('ul', 'agents');
      s.history.forEach((h, i) => ul.append(item(button('agent-btn', () => selectStage({ type: 'agent', id: h.id }), el('span', `dot ${h.verdict === 'fail' ? 'error' : h.status}`), el('span', 'n', `${i + 1}ª tentativa`), el('span', 's', h.verdict ? (h.verdict === 'pass' ? 'aprovado' : 'reprovado') : STATUS_PT[h.status] || '')))));
      body.append(ul);
    }
    body.append(...agentTimeline(a));
    return;
  }
  if (ui.sel?.type === 'agent') {
    const a = det.agents.find((x) => x.id === ui.sel.id);
    if (a) {
      head.append(back(), el('h3', null, a.label), el('p', null, `${STATUS_PT[a.status] || a.status}: ${a.step}`));
      return body.append(...agentTimeline(a));
    }
  }
  head.append(el('h3', null, 'Pipeline'), el('p', null, 'Tech Lead planeja, Engenheiro implementa, QA testa e DevOps sobe para o git. Clique numa etapa para ver os passos.'));
  for (const f of det.flows) {
    if (!f.run) continue;
    const box = el('section', 'flow focus');
    const fh = el('div', 'flow-head static');
    fh.append(el('span', 'n', f.run.task || 'Execução'), el('span', 'pstatus ' + f.run.status, RUN_PT[f.run.status]));
    box.append(fh);
    const ol = el('ol', 'stages');
    for (const s of f.run.stages) {
      const meta = [STAGE_PT[s.status], s.dur && s.status !== 'pending' ? dur(s.dur) : null, s.attempts > 1 ? `${s.attempts} tentativas` : null].filter(Boolean).join(', ');
      const b = button(`stage-btn ${s.status}`, () => selectStage({ type: 'stage', sid: f.sid, key: s.key }), el('span', 'dot'), el('span', 'n', s.label), el('span', 'm', meta));
      if (s.status === 'active') b.append(el('span', 's', s.step || ''));
      if (s.key === 'test' && s.verdict) b.append(el('span', 's ' + s.verdict, s.verdict === 'pass' ? 'Veredito: aprovado' : 'Veredito: reprovado'));
      if (s.key === 'ship' && s.status === 'done' && s.result) b.append(el('span', 's', s.result.split('\n').pop()));
      ol.append(item(b));
    }
    box.append(ol);
    if (f.run.reworks) box.append(el('p', 'hint', `O QA devolveu para o Engenheiro ${f.run.reworks} vez${f.run.reworks > 1 ? 'es' : ''}.`));
    if (f.runs > 1) box.append(el('p', 'hint', `Este chat rodou o pipeline ${f.runs} vezes; a cena mostra a mais recente.`));
    body.append(box);
  }
}
function agentTimeline(a) {
  const dl = el('dl', 'facts');
  const fact = (k, v) => v != null && v !== '' && dl.append(el('dt', null, k), el('dd', null, String(v)));
  fact('Agente', a.kind === 'main' ? 'Sessão principal (orquestrador)' : a.type);
  fact('Estado', STATUS_PT[a.status] || a.status);
  fact('Skill', a.skill || 'nenhuma');
  fact('Ferramentas', a.tools);
  if (a.errors) fact('Erros', a.errors);
  fact('Início', ago(a.started));
  if (a.result) fact('Resultado', a.result);
  const tl = el('ol', 'timeline');
  for (const s of [...a.steps].reverse()) {
    const li = el('li', s.st);
    li.append(el('div', 't', s.step));
    li.append(el('div', 'm', [s.tool, ago(s.t), s.dur != null ? `${(s.dur / 1000).toFixed(1)}s` : null].filter(Boolean).join(', ')));
    if (s.err) li.append(el('div', 'err', s.err));
    tl.append(li);
  }
  return [dl, tl];
}

function renderStage() {
  const d = ui.detail;
  $('#placeholder').hidden = !!d;
  $('#title').hidden = !d;
  $('#drawer').hidden = !d;
  $('#recenter').hidden = !d;
  $('#views').hidden = !(d && hasPipeline());
  const inset = d ? $('#drawer').offsetWidth + 24 : 0;
  history.setInset(inset);
  pipeline.setInset(inset);
  if (!d) {
    if (ui.chatId) $('#placeholder').firstElementChild.textContent = 'Carregando o histórico…';
    return;
  }
  renderTitle(d);
  if (ui.view === 'pipeline' && d.pipeline) renderPipelineDrawer(d.pipeline);
  else renderHistoryDrawer(d);
}

function renderFooter() {
  if (ui.mode === 'live') setConn('Ao vivo', 'live');
  else if (ui.mode === 'demo') setConn('Demonstração', 'demo');
  const r = ui.routes;
  const box = $('#router-stats');
  box.replaceChildren();
  if (r && r.total) {
    const avg = r.injected ? Math.round(r.tokens / r.injected) : 0;
    box.append(document.createTextNode('Roteador de skills: '), el('strong', null, `${r.injected} de ${r.total}`), document.createTextNode(` prompts com skill, ~${avg} tokens por sugestão`));
  }
}

function showTip(p, at) {
  const tip = $('#tip');
  if (!p || ui.view !== 'history') return (tip.hidden = true);
  tip.replaceChildren();
  if (p.kind === 'tool') {
    tip.append(el('b', null, p.tool.step), el('span', null, `${p.tool.name}${p.tool.err ? ', com erro' : ''}, no prompt ${p.turn.n + 1}`));
    if (p.tool.err) tip.append(el('span', 'err', p.tool.err));
  } else if (p.kind === 'agent') {
    const a = p.agent;
    tip.append(el('b', null, a.stage ? STAGE_LABEL[a.stage] : a.type), el('span', null, a.desc || ''));
    if (a.verdict) tip.append(el('span', null, a.verdict === 'pass' ? 'Veredito: aprovado' : 'Veredito: reprovado'));
  } else if (p.kind === 'turn') {
    tip.append(el('b', null, `Prompt ${p.turn.n + 1}`), el('span', null, (p.turn.prompt || '(início da sessão)').slice(0, 140)));
  }
  tip.style.left = `${Math.min(at.x + 14, (tip.parentElement.clientWidth || 800) - 280)}px`;
  tip.style.top = `${at.y + 14}px`;
  tip.hidden = false;
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    if (!ui.chatId && ui.chats.length && matchMedia('(min-width: 901px)').matches) {
      const first = groupChats(visibleChats(), ui.group)[0]?.chats[0];
      if (first) selectChat(first.id);
    }
    renderList();
    renderStage();
    renderFooter();
  });
}

// ------------------------------------------------------------------ controls
$('#filter').addEventListener('input', (e) => {
  ui.q = e.target.value;
  renderList();
});
$('#group').value = ui.group;
$('#show').value = ui.show;
$('#group').addEventListener('change', (e) => {
  ui.group = e.target.value;
  store.set('group', ui.group);
  renderList();
});
$('#show').addEventListener('change', (e) => {
  ui.show = e.target.value;
  store.set('show', ui.show);
  renderList();
});
for (const b of document.querySelectorAll('[data-view]')) b.addEventListener('click', () => setView(b.dataset.view));
$('#recenter').addEventListener('click', () => (ui.view === 'pipeline' ? pipeline.recenter() : history.recenter()));
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (ui.view === 'pipeline' && ui.sel) selectStage(null);
});

const params = new URLSearchParams(location.search);
if (true) startLocalDemo();
else if (!(await connectLive())) startLocalDemo();
setInterval(() => {
  renderList();
  renderFooter();
}, 30000); // keep relative times fresh
render();

</script>
