<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Fleet 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
:root {
  --sky: #0f2236;
  --sky-deep: #0a1828;
  --panel: #15304b;
  --panel-2: #1b3a59;
  --line: rgba(143, 179, 217, 0.22);
  --line-strong: rgba(143, 179, 217, 0.45);
  --ink: #e8eff7;
  --ink-2: #a9bdd3;
  --ink-3: #7690ad;
  --running: #f2b33d;
  --thinking: #7fd1c7;
  --waiting: #e58ac0;
  --error: #f2665c;
  --idle: #6f86a3;
  --focus: #ffd98a;
  --font-ui: 'Barlow', system-ui, sans-serif;
  --font-head: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
  --font-code: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --sky: #e9f0f7;
    --sky-deep: #dde7f1;
    --panel: #f6f9fc;
    --panel-2: #ffffff;
    --line: rgba(29, 53, 87, 0.16);
    --line-strong: rgba(29, 53, 87, 0.35);
    --ink: #142a44;
    --ink-2: #3c5774;
    --ink-3: #647d99;
    --running: #c98500;
    --thinking: #138a7d;
    --waiting: #b8448a;
    --error: #d1453b;
    --idle: #7a8ea6;
    --focus: #b36b00;
    color-scheme: light;
  }
}
:root[data-theme='light'] {
  --sky: #e9f0f7;
  --sky-deep: #dde7f1;
  --panel: #f6f9fc;
  --panel-2: #ffffff;
  --line: rgba(29, 53, 87, 0.16);
  --line-strong: rgba(29, 53, 87, 0.35);
  --ink: #142a44;
  --ink-2: #3c5774;
  --ink-3: #647d99;
  --running: #c98500;
  --thinking: #138a7d;
  --waiting: #b8448a;
  --error: #d1453b;
  --idle: #7a8ea6;
  --focus: #b36b00;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- project column ---------- */
.projects {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.projects header { padding: 20px 20px 12px; }
.brand { font: 600 21px/1.1 var(--font-head); letter-spacing: 0.01em; margin: 0; }
.brand small { display: block; font: 400 13px/1.4 var(--font-ui); color: var(--ink-3); margin-top: 4px; }
.filter {
  margin-top: 14px;
  width: 100%;
  background: var(--sky-deep);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--ink);
  font: inherit;
}
.filter::placeholder { color: var(--ink-3); }
.project-list { list-style: none; margin: 0; padding: 4px 10px 16px; overflow-y: auto; flex: 1; }
.project {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 8px;
  padding: 11px 12px 11px 14px;
  cursor: pointer;
  position: relative;
  display: grid;
  gap: 3px;
}
.project:hover { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.project[aria-current='true'] { background: var(--panel-2); }
.project[aria-current='true']::before {
  content: '';
  position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px;
  border-radius: 2px;
  background: var(--running);
}
.project .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.project .name { font: 600 16px/1.2 var(--font-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.project .step { font: 12px/1.35 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 5px; align-items: center; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.dot.sub { width: 5px; height: 5px; }
.dot.running { background: var(--running); box-shadow: 0 0 8px var(--running); }
.dot.thinking { background: var(--thinking); }
.dot.waiting { background: var(--waiting); }
.dot.error { background: var(--error); }
.dots .count { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.empty { padding: 18px 20px; color: var(--ink-2); font-size: 14px; }
.empty button, .linkish {
  background: none; border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 7px 12px; margin-top: 12px; cursor: pointer;
}
.projects footer {
  border-top: 1px solid var(--line);
  padding: 12px 20px 16px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.projects footer strong { color: var(--ink-2); font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.conn.live::before { background: var(--thinking); }
.conn.demo::before { background: var(--waiting); }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; }
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; }
.overlay { position: absolute; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.title { top: 20px; left: 24px; max-width: 50%; }
.title h2 { margin: 0; font: 600 30px/1.1 var(--font-head); }
.title p { margin: 4px 0 0; font: 12.5px var(--font-code); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--ink-2);
  background: color-mix(in srgb, var(--sky) 70%, transparent);
}
.chip b { font-weight: 600; color: var(--ink); }
.chip.running { border-color: var(--running); }
.chip.waiting { border-color: var(--waiting); }
.chip.error { border-color: var(--error); }

.layouts {
  top: 20px; right: 24px;
  display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden;
  background: color-mix(in srgb, var(--panel) 85%, transparent);
}
.layouts button { background: none; border: 0; padding: 7px 14px; cursor: pointer; color: var(--ink-2); }
.layouts button[aria-pressed='true'] { background: var(--panel-2); color: var(--ink); font-weight: 600; }

.legend {
  bottom: 18px; left: 24px;
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-2);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.placeholder {
  inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2);
  pointer-events: none;
}
.placeholder p { max-width: 34ch; margin: 0; }

/* agent labels in 3D */
.alabel {
  font: 12px/1.3 var(--font-ui);
  color: var(--ink);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--idle);
  border-radius: 6px;
  padding: 5px 8px;
  max-width: 230px;
  margin-left: 12px;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
}
.alabel .n { font: 600 13px/1.2 var(--font-head); overflow: hidden; text-overflow: ellipsis; }
.alabel .s { font: 11.5px/1.3 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.alabel.sub { opacity: 0.92; padding: 3px 7px; }
.alabel.sub .n { font-size: 12px; }
.alabel.running { border-left-color: var(--running); }
.alabel.thinking { border-left-color: var(--thinking); }
.alabel.waiting { border-left-color: var(--waiting); }
.alabel.error { border-left-color: var(--error); }
.alabel.sel { border-color: var(--ink); }
.alabel.quiet { display: none; }
.alabel.quiet.sel { display: block; }

/* ---------- drawer ---------- */
.drawer {
  position: absolute; top: 76px; right: 24px; bottom: 18px;
  width: 330px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; flex-direction: column;
  min-height: 0;
  backdrop-filter: blur(6px);
}
.drawer h3 { margin: 0; font: 600 17px/1.2 var(--font-head); }
.drawer .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.drawer .head p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.drawer .body { overflow-y: auto; padding: 8px 8px 14px; flex: 1; }
.agents { list-style: none; margin: 0; padding: 0; }
.agent-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center;
}
.agent-btn:hover { background: var(--panel-2); }
.agent-btn .dot { grid-row: span 2; }
.agent-btn .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn .s { font: 12px var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn.sub { padding-left: 26px; }
.back { background: none; border: 0; padding: 0 0 6px; color: var(--ink-3); cursor: pointer; font-size: 13px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 8px 6px; font-size: 13px; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0 8px; position: relative; }
.timeline li { position: relative; padding: 6px 0 6px 18px; border-left: 1px solid var(--line); }
.timeline li::before {
  content: ''; position: absolute; left: -4px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--idle);
}
.timeline li.running::before { background: var(--running); box-shadow: 0 0 8px var(--running); }
.timeline li.error::before { background: var(--error); }
.timeline li.done::before { background: var(--thinking); }
.timeline .t { font: 12px/1.35 var(--font-code); overflow-wrap: anywhere; }
.timeline .m { font-size: 11.5px; color: var(--ink-3); }
.timeline .err { color: var(--error); font-size: 12px; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; }
  .projects { border-right: 0; border-bottom: 1px solid var(--line); }
  .projects footer { display: none; }
  .drawer { top: auto; left: 16px; right: 16px; width: auto; height: 40%; }
  .title { left: 16px; max-width: 70%; }
  .title h2 { font-size: 22px; }
  .layouts { right: 16px; }
  .legend { display: none; }
}

[hidden] { display: none !important; }
#scene { z-index: 0; isolation: isolate; }
.overlay { z-index: 2; }

<body>
  <aside class="projects" aria-label="Projetos">
    <header>
      <h1 class="brand">Agent Fleet<small>Projetos com agentes trabalhando agora</small></h1>
      <input class="filter" id="filter" type="search" placeholder="Filtrar projetos" aria-label="Filtrar projetos" />
    </header>
    <ul class="project-list" id="projects"></ul>
    <footer>
      <div><span class="conn" id="conn">Conectando…</span></div>
      <div id="router-stats" style="margin-top:6px"></div>
    </footer>
  </aside>

  <main class="stage">
    <div id="scene" aria-hidden="true"></div>

    <div class="overlay title" id="title" hidden>
      <h2 id="p-name"></h2>
      <p id="p-root"></p>
      <div class="chips" id="p-chips"></div>
    </div>

    <div class="overlay layouts" role="group" aria-label="Visualização">
      <button type="button" data-layout="orbit" aria-pressed="true">Órbitas</button>
      <button type="button" data-layout="lanes" aria-pressed="false">Trilhas</button>
    </div>

    <div class="overlay placeholder" id="placeholder">
      <p>Escolha um projeto na coluna da esquerda para ver os agentes dele em 3D.</p>
    </div>

    <section class="overlay drawer" id="drawer" aria-label="Agentes do projeto" hidden>
      <div class="head" id="d-head"></div>
      <div class="body" id="d-body"></div>
    </section>

    <div class="overlay legend" aria-hidden="true">
      <span><i style="background:var(--running)"></i>Executando ferramenta</span>
      <span><i style="background:var(--thinking)"></i>Pensando</span>
      <span><i style="background:var(--waiting)"></i>Aguardando você</span>
      <span><i style="background:var(--error)"></i>Erro no último passo</span>
      <span><i style="background:var(--idle)"></i>Ocioso ou concluído</span>
    </div>
  </main>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
// Isomorphic state reducer for agent telemetry events (runs in Node and in the browser).
const ACTIVE_WINDOW_MS = 60 * 60 * 1000; // project stays listed for 1h after last activity
const STALE_MS = 15 * 60 * 1000; // agent with no events for 15 min shows as stale
const MAX_STEPS = 40;
const SUB_LINGER_MS = 2 * 60 * 1000;

function createState() {
  return { projects: new Map(), routes: { total: 0, injected: 0, tokens: 0, bySkill: {} }, version: 0 };
}

function project(state, p) {
  let pr = state.projects.get(p.id);
  if (!pr) {
    pr = { id: p.id, name: p.name, root: p.root, last: 0, agents: new Map() };
    state.projects.set(p.id, pr);
  }
  return pr;
}

function agent(pr, id, init) {
  let a = pr.agents.get(id);
  if (!a) {
    a = {
      id,
      parent: null,
      kind: 'main',
      type: 'main',
      label: 'Sessão principal',
      status: 'ready',
      step: 'Sessão iniciada',
      tool: null,
      skill: null,
      steps: [],
      started: init.t,
      last: init.t,
      tools: 0,
      errors: 0,
      pending: [],
      ...init.fields,
    };
    pr.agents.set(id, a);
  }
  return a;
}

function pushStep(a, s) {
  a.steps.push(s);
  if (a.steps.length > MAX_STEPS) a.steps.splice(0, a.steps.length - MAX_STEPS);
}

/** Apply one raw hook event. Returns the touched project id (or null). */
function apply(state, ev) {
  if (!ev || !ev.proj || !ev.sid) return null;
  const pr = project(state, ev.proj);
  pr.last = Math.max(pr.last, ev.t);
  const main = agent(pr, ev.sid, { t: ev.t, fields: { label: `Sessão ${ev.sid.slice(0, 4)}` } });

  let a = main;
  if (ev.aid && ev.aid !== ev.sid) {
    a = agent(pr, ev.aid, {
      t: ev.t,
      fields: { parent: ev.sid, kind: 'sub', type: ev.at || 'subagent', label: ev.at || 'subagent' },
    });
  }
  a.last = Math.max(a.last, ev.t);
  state.version++;

  switch (ev.e) {
    case 'SessionStart':
      a.status = 'ready';
      a.step = ev.source === 'resume' ? 'Sessão retomada' : 'Sessão iniciada';
      break;
    case 'UserPromptSubmit':
      a.status = 'thinking';
      a.step = ev.step || 'Novo prompt';
      pushStep(a, { t: ev.t, tool: 'Prompt', step: a.step, st: 'done' });
      break;
    case 'Route': {
      state.routes.total++;
      if (ev.mode === 'single' || ev.mode === 'shortlist') {
        state.routes.injected++;
        state.routes.tokens += ev.tokens || 0;
        for (const s of ev.skills || []) state.routes.bySkill[s] = (state.routes.bySkill[s] || 0) + 1;
        a.skill = ev.skills?.[0] || a.skill;
        pushStep(a, { t: ev.t, tool: 'Router', step: `Skill → ${(ev.skills || []).join(', ')}`, st: 'done' });
      }
      break;
    }
    case 'PreToolUse':
      a.status = 'running';
      a.step = ev.step || ev.tool;
      a.tool = ev.tool;
      a.tools++;
      if (ev.skill) a.skill = ev.skill;
      if (ev.delegate) a.pending.push(ev.delegate);
      pushStep(a, { t: ev.t, id: ev.tuid, tool: ev.tool, step: a.step, st: 'running' });
      break;
    case 'PostToolUse':
    case 'PostToolUseFailure': {
      const s = [...a.steps].reverse().find((x) => (ev.tuid ? x.id === ev.tuid : x.st === 'running'));
      const failed = ev.e === 'PostToolUseFailure';
      if (s) {
        s.st = failed ? 'error' : 'done';
        s.dur = ev.t - s.t;
        if (failed) s.err = ev.err;
      }
      if (failed) a.errors++;
      a.status = failed ? 'error' : 'thinking';
      if (!a.steps.some((x) => x.st === 'running')) a.tool = null;
      break;
    }
    case 'Notification':
    case 'PermissionRequest':
      a.status = 'waiting';
      a.step = ev.step || 'Aguardando entrada';
      break;
    case 'SubagentStart': {
      // The subagent itself (ev.aid) was created above; label it from the parent's pending delegation.
      const i = main.pending.findIndex((d) => d.type === ev.at);
      const d = i >= 0 ? main.pending.splice(i, 1)[0] : main.pending.shift();
      if (a !== main) {
        a.status = 'thinking';
        a.step = d?.desc ? `Iniciando: ${d.desc}` : 'Iniciando';
        if (d?.desc) a.label = `${a.type}: ${d.desc}`;
      }
      break;
    }
    case 'SubagentStop':
      a.status = 'done';
      a.step = 'Concluído';
      break;
    case 'Stop':
      a.status = a.kind === 'main' ? 'idle' : 'done';
      a.step = a.kind === 'main' ? 'Aguardando você' : 'Concluído';
      a.tool = null;
      break;
    case 'SessionEnd':
      for (const x of pr.agents.values()) if (x.id === ev.sid || x.parent === ev.sid) x.status = 'ended';
      break;
    default:
      break;
  }
  return pr.id;
}

function effectiveStatus(a, now) {
  if (['done', 'ended', 'idle'].includes(a.status)) return a.status;
  return now - a.last > STALE_MS ? 'stale' : a.status;
}

const LIVE = new Set(['running', 'thinking', 'waiting', 'error', 'ready']);

function listProjects(state, now = Date.now(), { includeInactive = false } = {}) {
  const out = [];
  for (const pr of state.projects.values()) {
    const counts = { running: 0, thinking: 0, waiting: 0, error: 0, idle: 0, done: 0, stale: 0, ready: 0, ended: 0 };
    let live = 0;
    for (const a of pr.agents.values()) {
      const st = effectiveStatus(a, now);
      counts[st] = (counts[st] || 0) + 1;
      if (LIVE.has(st)) live++;
    }
    const active = live > 0 || now - pr.last < ACTIVE_WINDOW_MS;
    if (!active && !includeInactive) continue;
    const lead = [...pr.agents.values()].sort((x, y) => y.last - x.last)[0];
    out.push({ id: pr.id, name: pr.name, root: pr.root, last: pr.last, total: pr.agents.size, live, counts, active, step: lead?.step || '' });
  }
  return out.sort((x, y) => y.live - x.live || y.last - x.last);
}

function projectDetail(state, id, now = Date.now()) {
  const pr = state.projects.get(id);
  if (!pr) return null;
  const agents = [...pr.agents.values()]
    // finished subagents leave the view after 2 min; ended sessions after the active window
    .filter((a) => !(a.kind === 'sub' && (a.status === 'done' || a.status === 'ended') && now - a.last > SUB_LINGER_MS))
    .filter((a) => a.status !== 'ended' || now - a.last < ACTIVE_WINDOW_MS)
    .map(({ pending, ...a }) => ({ ...a, status: effectiveStatus(a, now), steps: a.steps.slice(-25) }));
  return { id: pr.id, name: pr.name, root: pr.root, last: pr.last, agents };
}

// ---------------------------------------------------------------------------
// Demo generator: plausible multi-agent activity, same event shape as the hooks.
const DEMO_PROJECTS = [
  { id: 'demo-checkout', name: 'checkout-api', root: '~/code/checkout-api' },
  { id: 'demo-mobile', name: 'mobile-app', root: '~/code/mobile-app' },
  { id: 'demo-data', name: 'data-pipeline', root: '~/code/data-pipeline' },
  { id: 'demo-site', name: 'landing-site', root: '~/code/landing-site' },
];
const SUBS = [
  ['Explore', 'Mapear módulos de pagamento'],
  ['general-purpose', 'Escrever testes de integração'],
  ['Plan', 'Desenhar estratégia de retry'],
  ['security-reviewer', 'Revisar mudanças de auth'],
  ['Explore', 'Encontrar código morto'],
];
const TOOLS = [
  ['Read', 'Read src/payments/service.ts'],
  ['Grep', 'Grep "processPayment"'],
  ['Edit', 'Edit retry-policy.ts'],
  ['Bash', 'Rodar testes unitários'],
  ['Bash', 'npm run lint'],
  ['Write', 'Write checkout.spec.ts'],
  ['WebSearch', 'Search "stripe idempotency keys"'],
  ['Glob', 'Glob src/**/*.tsx'],
  ['Read', 'Read SKILL.md'],
  ['mcp__github__create_pull_request', 'create_pull_request (github)'],
];
const SKILLS = ['tlc-spec-driven', 'security-best-practices', 'react-native-expert', 'core-web-vitals', 'mermaid-studio', 'the-judge'];

function startDemo(emit, { speed = 1, rand = Math.random } = {}) {
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];
  const sessions = [];
  let n = 0;
  const t0 = Date.now();
  DEMO_PROJECTS.forEach((p, i) => {
    const count = i === 0 ? 2 : 1;
    for (let k = 0; k < count; k++) {
      const sid = Math.floor(rand() * 0xffffffff).toString(16).padStart(8, '0') + i + k;
      sessions.push({ sid, proj: p, subs: [], main: { aid: null, at: null, open: null } });
      emit({ t: t0, e: 'SessionStart', sid, proj: p, source: 'startup' });
      emit({ t: t0, e: 'UserPromptSubmit', sid, proj: p, step: 'Prompt: implemente a próxima tarefa' });
      emit({ t: t0, e: 'Route', sid, proj: p, mode: 'single', skills: [SKILLS[(i + k) % SKILLS.length]], tokens: 62 });
    }
  });

  const tick = () => {
    const t = Date.now();
    const s = pick(sessions);
    const actors = [s.main, s.main, ...s.subs.filter((x) => !x.done)];
    const actor = pick(actors);
    const base = { t, sid: s.sid, proj: s.proj, aid: actor.aid, at: actor.at };
    const r = rand();
    if (actor.open) {
      emit({ ...base, e: r < 0.06 ? 'PostToolUseFailure' : 'PostToolUse', tool: actor.open[0], tuid: actor.open[2], err: 'exit code 1' });
      actor.open = null;
    } else if (!actor.aid && r < 0.1 && s.subs.filter((x) => !x.done).length < 3) {
      const [type, desc] = pick(SUBS);
      const aid = `a${(n++).toString(36)}${Math.floor(rand() * 1e5).toString(36)}`;
      emit({ ...base, e: 'PreToolUse', tool: 'Agent', step: `Delegando: ${desc}`, tuid: `d${aid}`, delegate: { type, desc } });
      emit({ t, sid: s.sid, proj: s.proj, aid, at: type, e: 'SubagentStart' });
      s.subs.push({ aid, at: type, done: false, born: t, parentTuid: `d${aid}` });
    } else if (actor.aid && t - actor.born > 25000 / speed && r < 0.25) {
      emit({ ...base, e: 'SubagentStop' });
      actor.done = true;
      emit({ t, sid: s.sid, proj: s.proj, e: 'PostToolUse', tool: 'Agent', tuid: actor.parentTuid });
      setTimeout(() => (s.subs = s.subs.filter((x) => x !== actor)), 20000 / speed);
    } else if (!actor.aid && r < 0.14) {
      emit({ ...base, e: 'Notification', step: 'Aguardando permissão: Bash' });
    } else {
      const [tool, step] = pick(TOOLS);
      const tuid = `t${(n++).toString(36)}`;
      actor.open = [tool, step, tuid];
      emit({ ...base, e: 'PreToolUse', tool, step, tuid });
    }
  };
  const id = setInterval(tick, Math.max(120, 700 / speed));
  return () => clearInterval(id);
}

// 3D view of one project's agents. Two layouts share the same objects:
//  - orbit: agents revolve around the project core, subagents orbit their parent,
//           the last steps trail behind each agent as small packets.
//  - lanes: one track per agent, steps laid out as bars (height = duration), newest at the head.




const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const QUIET = new Set(['idle', 'done', 'stale', 'ended', 'ready']);
const MAX_BEADS = 12;

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.25, 'rgba(255,255,255,0.45)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function category(tool = '') {
  if (/^(Read|Grep|Glob|LS)$/.test(tool)) return 'read';
  if (/^(Edit|Write|MultiEdit|NotebookEdit)$/.test(tool)) return 'edit';
  if (tool === 'Bash') return 'exec';
  if (/^Web/.test(tool)) return 'web';
  if (tool === 'Agent' || tool === 'Task') return 'delegate';
  if (tool === 'Router' || tool === 'Skill' || tool === 'Prompt') return 'meta';
  return 'other';
}

function createScene(el, { onSelect } = {}) {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  el.appendChild(renderer.domElement);
  const labelRenderer = new CSS2DRenderer();
  Object.assign(labelRenderer.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
  el.appendChild(labelRenderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 400);
  camera.position.set(0, 9.5, 17);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.minDistance = 5;
  controls.maxDistance = 70;
  controls.maxPolarAngle = 1.48;
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.25;
  controls.addEventListener('start', () => (controls.autoRotate = false));

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const coreLight = new THREE.PointLight(0xffffff, 40, 40, 1.6);
  scene.add(coreLight);
  const glow = glowTexture();

  // palette from CSS tokens (follows light/dark)
  let pal = {};
  let light = false;
  function readPalette() {
    const keys = ['sky', 'line-strong', 'ink', 'ink-2', 'ink-3', 'running', 'thinking', 'waiting', 'error', 'idle', 'focus'];
    pal = Object.fromEntries(keys.map((k) => [k, new THREE.Color(css('--' + k).startsWith('rgba') ? css('--ink-3') : css('--' + k))]));
    light = pal.sky.getHSL({}).l > 0.5;
    scene.background = pal.sky;
    scene.fog = new THREE.Fog(pal.sky, 30, 110);
  }
  readPalette();
  const statusColor = (st) => pal[st] || pal.idle;
  const beadColor = (s) =>
    s.st === 'error' ? pal.error : s.st === 'running' ? pal.running : { read: pal['ink-3'], edit: pal.thinking, exec: pal.running, web: pal.waiting, delegate: pal.ink, meta: pal.focus, other: pal['ink-2'] }[category(s.tool)];

  // star chart: polar rings and spokes
  const chart = new THREE.Group();
  const chartMat = new THREE.LineBasicMaterial({ transparent: true, opacity: 0.3 });
  for (const r of [3, 6, 9, 12]) {
    const pts = [];
    for (let i = 0; i <= 128; i++) pts.push(new THREE.Vector3(Math.cos((i / 128) * Math.PI * 2) * r, 0, Math.sin((i / 128) * Math.PI * 2) * r));
    chart.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), chartMat));
  }
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2;
    chart.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(a) * 1.6, 0, Math.sin(a) * 1.6), new THREE.Vector3(Math.cos(a) * 12.6, 0, Math.sin(a) * 12.6)]), chartMat));
  }
  chart.position.y = -1.4;
  scene.add(chart);

  const starGeo = new THREE.BufferGeometry();
  const sp = [];
  for (let i = 0; i < 900; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(70 + Math.random() * 60);
    v.y = Math.abs(v.y) * 0.8 - 8;
    sp.push(v.x, v.y, v.z);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(sp, 3));
  const starMat = new THREE.PointsMaterial({ size: 0.35, transparent: true, opacity: 0.7, depthWrite: false });
  const stars = new THREE.Points(starGeo, starMat);
  scene.add(stars);

  // project core
  const core = new THREE.Group();
  const coreWire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 1), new THREE.MeshBasicMaterial({ wireframe: true, transparent: true, opacity: 0.55 }));
  const coreBall = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), new THREE.MeshBasicMaterial());
  core.add(coreWire, coreBall);
  scene.add(core);
  const spokeMat = new THREE.LineDashedMaterial({ dashSize: 0.25, gapSize: 0.18, transparent: true, opacity: 0.5 });

  function applyThemeColors() {
    chartMat.color.copy(pal['line-strong']);
    starMat.color.copy(light ? pal['ink-3'] : pal.ink);
    starMat.opacity = light ? 0.35 : 0.7;
    coreWire.material.color.copy(pal['ink-2']);
    coreBall.material.color.copy(pal.focus);
    spokeMat.color.copy(pal['ink-3']);
  }
  applyThemeColors();
  const retheme = () => {
    readPalette();
    applyThemeColors();
    for (const o of objs.values()) o.halo.material.blending = light ? THREE.NormalBlending : THREE.AdditiveBlending;
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------------------------------------------------------------- agents
  const objs = new Map();
  const beadGeo = new THREE.BoxGeometry(1, 1, 1);
  let layout = 'orbit';
  let selected = null;
  let projectId = null;

  function makeAgent(a, parentObj) {
    const main = a.kind === 'main';
    const r = main ? 0.55 : 0.32;
    const group = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 16), new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.1, emissiveIntensity: 0.7 }));
    body.userData.agentId = a.id;
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false, blending: light ? THREE.NormalBlending : THREE.AdditiveBlending }));
    halo.scale.setScalar(r * 5);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 1.75, 0.035, 8, 64), new THREE.MeshBasicMaterial());
    ring.rotation.x = Math.PI / 2.4;
    group.add(halo, body, ring);

    const holder = document.createElement('div');
    const inner = document.createElement('div');
    inner.className = 'alabel' + (main ? '' : ' sub');
    inner.innerHTML = '<div class="n"></div><div class="s"></div>';
    inner.addEventListener('click', () => onSelect?.(a.id));
    holder.appendChild(inner);
    const label = new CSS2DObject(holder);
    label.center.set(0, 0.5);
    label.position.set(r * 0.9, 0, 0);
    group.add(label);

    const beads = [];
    for (let i = 0; i < MAX_BEADS; i++) {
      const m = new THREE.Mesh(beadGeo, new THREE.MeshBasicMaterial({ transparent: true }));
      m.visible = false;
      scene.add(m);
      beads.push(m);
    }
    const tether = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), spokeMat);
    scene.add(tether);
    const lane = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), chartMat);
    scene.add(lane);

    const start = parentObj ? parentObj.group.position.clone() : new THREE.Vector3();
    group.position.copy(start);
    group.scale.setScalar(0.01);
    scene.add(group);
    return { group, body, halo, ring, label, inner, beads, tether, lane, r, data: a, target: new THREE.Vector3(), phase: Math.random() * Math.PI * 2, dying: 0 };
  }

  function disposeAgent(o) {
    scene.remove(o.group, o.tether, o.lane, ...o.beads);
    o.label.element.remove();
    o.body.geometry.dispose();
    o.ring.geometry.dispose();
    o.tether.geometry.dispose();
    o.lane.geometry.dispose();
    for (const b of o.beads) b.material.dispose();
  }

  function setProject(detail) {
    if (!detail) {
      for (const o of objs.values()) disposeAgent(o);
      objs.clear();
      projectId = null;
      core.visible = false;
      return;
    }
    if (detail.id !== projectId) {
      for (const o of objs.values()) disposeAgent(o);
      objs.clear();
      projectId = detail.id;
      selected = null;
      controls.autoRotate = !reduceMotion;
      flyTo(layout);
    }
    core.visible = layout === 'orbit';
    const seen = new Set();
    // parents first so children can spawn from them
    const ordered = [...detail.agents].sort((x, y) => (x.kind === 'main' ? 0 : 1) - (y.kind === 'main' ? 0 : 1));
    for (const a of ordered) {
      seen.add(a.id);
      let o = objs.get(a.id);
      if (!o) {
        o = makeAgent(a, a.parent ? objs.get(a.parent) : null);
        objs.set(a.id, o);
      }
      o.data = a;
      o.dying = 0;
      o.inner.querySelector('.n').textContent = a.kind === 'main' ? a.label : a.label;
      o.inner.querySelector('.s').textContent = (a.skill && a.kind === 'main' && QUIET.has(a.status) ? `skill ${a.skill}` : a.step) || '';
      o.inner.className = `alabel ${a.kind === 'main' ? '' : 'sub'} ${a.status} ${QUIET.has(a.status) && a.kind !== 'main' ? 'quiet' : ''} ${selected === a.id ? 'sel' : ''}`;
    }
    for (const [id, o] of objs) if (!seen.has(id) && !o.dying) o.dying = performance.now();
  }

  function select(id) {
    selected = id;
    for (const [aid, o] of objs) o.inner.classList.toggle('sel', aid === id);
  }

  // ---------------------------------------------------------------- layouts
  function ordering() {
    const list = [...objs.values()].filter((o) => !o.dying);
    const mains = list.filter((o) => o.data.kind === 'main').sort((a, b) => a.data.started - b.data.started);
    const subsOf = (id) => list.filter((o) => o.data.parent === id).sort((a, b) => a.data.started - b.data.started);
    const orphans = list.filter((o) => o.data.kind !== 'main' && !objs.get(o.data.parent));
    return { mains, subsOf, orphans };
  }

  const mainOrbit = (i, n, t) => {
    const R = n <= 3 ? 4.8 : n > 6 ? 6 + 0.45 * (n - 6) : 6;
    return { R, a: (i / Math.max(n, 1)) * Math.PI * 2 + t * 0.035 };
  };
  const subOffset = (k, kc, t, phase, r = 1.9) => {
    const a = (k / Math.max(kc, 1)) * Math.PI * 2 + t * 0.28 + phase;
    return new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r * 0.42, Math.sin(a) * r * 0.9);
  };

  function computeTargets(t) {
    const { mains, subsOf, orphans } = ordering();
    if (layout === 'orbit') {
      mains.forEach((o, i) => {
        const { R, a } = mainOrbit(i, mains.length, t);
        o.target.set(Math.cos(a) * R, 0, Math.sin(a) * R);
        o.orbit = { kind: 'main', R, a };
        const subs = subsOf(o.data.id);
        subs.forEach((s, k) => {
          s.target.copy(o.target).add(subOffset(k, subs.length, t, o.phase));
          s.orbit = { kind: 'sub', parent: o, k, kc: subs.length };
        });
      });
      orphans.forEach((o, i) => {
        o.target.set(Math.cos(i) * 3, 1.5, Math.sin(i) * 3);
        o.orbit = null;
      });
    } else {
      const rows = [];
      for (const m of mains) rows.push(m, ...subsOf(m.data.id));
      rows.push(...orphans);
      const n = rows.length;
      if (n !== laneCount) {
        laneCount = n;
        flyTo('lanes');
      }
      rows.forEach((o, i) => {
        o.target.set(2.5, 0, (i - (n - 1) / 2) * 1.45);
        o.orbit = null;
      });
    }
  }

  function placeBeads(o, t) {
    const steps = (o.data.steps || []).slice(-MAX_BEADS).reverse(); // newest first
    o.beads.forEach((b, j) => {
      const s = steps[j];
      b.visible = !!s && !o.dying;
      if (!s) return;
      b.material.color.copy(beadColor(s));
      const age = j / MAX_BEADS;
      b.material.opacity = 1 - age * 0.75;
      let p;
      if (layout === 'lanes') {
        const h = Math.min(1.9, 0.25 + Math.log10(1 + (s.dur || (s.st === 'running' ? 1500 : 300)) / 150) * 0.55);
        const pulse = s.st === 'running' && !reduceMotion ? 1 + 0.15 * Math.sin(t * 6) : 1;
        b.scale.set(0.34, h * pulse, 0.34);
        b.rotation.set(0, 0, 0);
        p = new THREE.Vector3(o.group.position.x - 1 - j * 0.5, h / 2 - 0.45, o.group.position.z);
      } else {
        const sz = (o.data.kind === 'main' ? 0.2 : 0.13) * (1 - age * 0.5);
        b.scale.setScalar(sz);
        if (!reduceMotion) b.rotation.set(t * 0.8 + j, t * 0.6 + j, 0);
        if (o.orbit?.kind === 'main') {
          const a = o.orbit.a - (j + 1) * 0.12;
          p = new THREE.Vector3(Math.cos(a) * o.orbit.R, 0, Math.sin(a) * o.orbit.R);
        } else if (o.orbit?.kind === 'sub') {
          const par = o.orbit.parent;
          const off = subOffset(o.orbit.k, o.orbit.kc, t - (j + 1) * 0.55, par.phase);
          p = par.group.position.clone().add(off);
        } else p = o.group.position.clone().add(new THREE.Vector3(-(j + 1) * 0.4, 0, 0));
      }
      b.position.lerp(p, b.userData.placed ? 0.25 : 1);
      b.userData.placed = true;
    });
  }

  // ---------------------------------------------------------------- camera
  let fly = null;
  let laneCount = 0;
  function flyTo(name) {
    const n = Math.max(3, laneCount);
    const to = name === 'lanes' ? { pos: new THREE.Vector3(-2, 4 + n * 0.75, 6 + n * 1.05), target: new THREE.Vector3(-2, -0.3, 0) } : { pos: new THREE.Vector3(0, 9.5, 17), target: new THREE.Vector3(0, 0, 0) };
    if (reduceMotion) {
      camera.position.copy(to.pos);
      controls.target.copy(to.target);
      return;
    }
    fly = { from: camera.position.clone(), fromT: controls.target.clone(), ...to, t0: performance.now() };
  }

  function setLayout(name) {
    if (name === layout) return;
    layout = name;
    chart.visible = name === 'orbit';
    core.visible = name === 'orbit' && !!projectId;
    controls.autoRotate = name === 'orbit' && !reduceMotion;
    for (const o of objs.values()) for (const b of o.beads) b.userData.placed = false;
    flyTo(name);
  }

  // ---------------------------------------------------------------- picking
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const hit = pick(e);
    onSelect?.(hit ? hit.object.userData.agentId : null);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    renderer.domElement.style.cursor = pick(e) ? 'pointer' : '';
  });
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects([...objs.values()].map((o) => o.body))[0];
  }

  // ---------------------------------------------------------------- loop
  // Optical center sits left of the agent drawer so nothing important hides behind it.
  let rightInset = 0;
  function resize() {
    const { clientWidth: w, clientHeight: h } = el;
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
    camera.aspect = w / Math.max(h, 1);
    if (rightInset && w > 900) camera.setViewOffset(w, h, rightInset / 2, 0, w, h);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  function setInset(px) {
    if (px === rightInset) return;
    rightInset = px;
    resize();
  }
  new ResizeObserver(resize).observe(el);
  resize();

  const clock = new THREE.Clock();
  let simT = 0;
  function frame() {
    requestAnimationFrame(frame);
    if (document.hidden) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    if (!reduceMotion) simT += dt;
    const t = simT;
    const k = 1 - Math.exp(-dt * 5);

    if (fly) {
      const u = Math.min(1, (performance.now() - fly.t0) / 900);
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      camera.position.lerpVectors(fly.from, fly.pos, e);
      controls.target.lerpVectors(fly.fromT, fly.target, e);
      if (u >= 1) fly = null;
    }

    core.rotation.y += dt * 0.25;
    coreWire.rotation.x += dt * 0.1;
    computeTargets(t);

    const now = performance.now();
    for (const [id, o] of objs) {
      const st = o.data.status;
      const col = statusColor(st);
      o.body.material.color.copy(col);
      o.body.material.emissive.copy(col).multiplyScalar(QUIET.has(st) ? 0.15 : 0.55);
      o.halo.material.color.copy(col);
      o.ring.material.color.copy(col);
      o.ring.visible = st === 'running';
      if (!reduceMotion) o.ring.rotation.z += dt * 2.4;

      let haloOp = QUIET.has(st) ? 0.18 : 0.55;
      let s = 1;
      if (!reduceMotion) {
        if (st === 'running') s = 1 + 0.07 * Math.sin(t * 7 + o.phase);
        if (st === 'waiting') haloOp = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(t * 4));
        if (st === 'thinking') haloOp = 0.4 + 0.15 * Math.sin(t * 2 + o.phase);
      }
      if (selected === id) haloOp = Math.max(haloOp, 0.85);
      o.halo.material.opacity = haloOp * (light ? 0.6 : 1);

      if (o.dying) {
        const u = (now - o.dying) / 700;
        o.group.scale.setScalar(Math.max(0.01, 1 - u));
        if (u >= 1) {
          disposeAgent(o);
          objs.delete(id);
          continue;
        }
      } else {
        const cur = o.group.scale.x;
        o.group.scale.setScalar(cur + (s - cur) * Math.min(1, k * 2));
        o.group.position.lerp(o.target, k);
      }

      // tether: core → main (orbit), parent → sub (both layouts)
      const pos = o.tether.geometry.attributes.position;
      const parent = o.data.parent ? objs.get(o.data.parent) : null;
      const from = parent ? parent.group.position : layout === 'orbit' ? core.position : null;
      o.tether.visible = !!from && !o.dying;
      if (from) {
        pos.setXYZ(0, from.x, from.y, from.z);
        pos.setXYZ(1, o.group.position.x, o.group.position.y, o.group.position.z);
        pos.needsUpdate = true;
        o.tether.computeLineDistances();
        o.tether.geometry.computeBoundingSphere();
      }
      const lp = o.lane.geometry.attributes.position;
      o.lane.visible = layout === 'lanes' && !o.dying;
      if (o.lane.visible) {
        lp.setXYZ(0, -7.5, -0.45, o.group.position.z);
        lp.setXYZ(1, o.group.position.x, -0.45, o.group.position.z);
        lp.needsUpdate = true;
        o.lane.geometry.computeBoundingSphere();
      }
      placeBeads(o, t);
    }

    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  core.visible = false;
  frame();

  return { setProject, setLayout, select, setInset };
}


const $ = (s) => document.querySelector(s);
const STATUS_PT = {
  running: 'Executando',
  thinking: 'Pensando',
  waiting: 'Aguardando você',
  error: 'Erro no último passo',
  idle: 'Ocioso',
  ready: 'Pronto',
  done: 'Concluído',
  stale: 'Sem atividade',
  ended: 'Encerrado',
};

const ui = { projects: [], details: {}, routes: null, selected: null, agent: null, filter: '', mode: 'connecting' };

const scene = createScene($('#scene'), { onSelect: (id) => selectAgent(id) });

// ------------------------------------------------------------------ data
let es = null;
function connectLive() {
  return new Promise((resolve) => {
    if (!location.protocol.startsWith('http')) return resolve(false);
    let opened = false;
    es = new EventSource('/api/stream');
    const timer = setTimeout(() => {
      if (!opened) {
        es.close();
        resolve(false);
      }
    }, 2500);
    es.addEventListener('update', (m) => {
      const d = JSON.parse(m.data);
      if (!opened) {
        opened = true;
        clearTimeout(timer);
        ui.mode = d.demo ? 'demo' : 'live';
        resolve(true);
      }
      ui.projects = d.projects;
      ui.routes = d.routes;
      Object.assign(ui.details, d.details);
      render();
    });
    es.onerror = () => {
      if (!opened) {
        clearTimeout(timer);
        es.close();
        resolve(false);
      } else setConn('Reconectando…', '');
    };
  });
}

let local = null;
function startLocalDemo() {
  if (local) return;
  es?.close();
  const state = createState();
  local = state;
  ui.mode = 'demo';
  startDemo((ev) => apply(state, ev), { speed: 1.4 });
  const pull = () => {
    const now = Date.now();
    ui.projects = listProjects(state, now);
    ui.routes = state.routes;
    for (const p of ui.projects) ui.details[p.id] = projectDetail(state, p.id, now);
    render();
  };
  pull();
  setInterval(pull, 500);
}

async function ensureDetail(id) {
  if (ui.details[id] || ui.mode !== 'live') return;
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(id)}`);
    if (r.ok) ui.details[id] = await r.json();
  } catch {}
}

// ------------------------------------------------------------------ helpers
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 10) return 'agora';
  if (s < 60) return `há ${s}s`;
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  return `há ${Math.round(s / 3600)} h`;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function setConn(text, cls) {
  const c = $('#conn');
  c.textContent = text;
  c.className = 'conn ' + cls;
}

// ------------------------------------------------------------------ render
function renderProjects() {
  const list = $('#projects');
  const focusId = document.activeElement?.dataset?.pid;
  const q = ui.filter.trim().toLowerCase();
  const items = ui.projects.filter((p) => !q || p.name.toLowerCase().includes(q) || p.root.toLowerCase().includes(q));
  list.replaceChildren();
  if (!ui.projects.length) {
    const li = el('li', 'empty');
    li.append(el('div', null, 'Nenhum agente trabalhando agora. Abra o Claude Code em um projeto e ele aparece aqui assim que o primeiro agente agir.'));
    if (ui.mode !== 'demo') {
      const b = el('button', null, 'Ver demonstração');
      b.type = 'button';
      b.onclick = startLocalDemo;
      li.append(b);
    }
    list.append(li);
    return;
  }
  if (!items.length) {
    list.append(el('li', 'empty', `Nenhum projeto corresponde a “${ui.filter}”.`));
    return;
  }
  for (const p of items) {
    const li = el('li');
    const b = el('button', 'project');
    b.type = 'button';
    b.setAttribute('aria-current', String(p.id === ui.selected));
    const row = el('div', 'row');
    row.append(el('span', 'name', p.name), el('span', 'when', ago(p.last)));
    const dots = el('div', 'dots');
    const det = ui.details[p.id];
    const agents = det ? det.agents : [];
    for (const a of agents.slice(0, 14)) dots.append(el('span', `dot ${a.status} ${a.kind === 'main' ? '' : 'sub'}`));
    const busy = p.counts.running + p.counts.thinking;
    dots.append(el('span', 'count', `${busy} de ${p.total} ativos${p.counts.waiting ? `, ${p.counts.waiting} aguardando` : ''}`));
    b.append(row, dots, el('div', 'step', p.step || ''));
    b.setAttribute('aria-label', `${p.name}: ${busy} de ${p.total} agentes ativos`);
    b.onclick = () => selectProject(p.id);
    b.dataset.pid = p.id;
    li.append(b);
    list.append(li);
    if (p.id === focusId) b.focus();
  }
}

function renderStage() {
  const det = ui.selected ? ui.details[ui.selected] : null;
  $('#placeholder').hidden = !!det;
  $('#title').hidden = !det;
  $('#drawer').hidden = !det;
  scene.setProject(det);
  scene.setInset(det ? $('#drawer').offsetWidth + 24 : 0);
  if (!det) return;
  $('#p-name').textContent = det.name;
  $('#p-root').textContent = det.root;
  const chips = $('#p-chips');
  chips.replaceChildren();
  const c = {};
  for (const a of det.agents) c[a.status] = (c[a.status] || 0) + 1;
  for (const st of ['running', 'thinking', 'waiting', 'error', 'idle', 'done']) {
    if (!c[st]) continue;
    const chip = el('span', `chip ${st}`);
    chip.append(el('b', null, String(c[st])), document.createTextNode(' ' + STATUS_PT[st].toLowerCase()));
    chips.append(chip);
  }
  renderDrawer(det);
}

function renderDrawer(det) {
  const head = $('#d-head');
  const body = $('#d-body');
  head.replaceChildren();
  body.replaceChildren();
  const a = ui.agent && det.agents.find((x) => x.id === ui.agent);
  if (!a) {
    head.append(el('h3', null, 'Agentes'), el('p', null, 'Clique em um agente na cena ou na lista para ver os passos.'));
    const ul = el('ul', 'agents');
    const mains = det.agents.filter((x) => x.kind === 'main');
    const order = [...mains.flatMap((m) => [m, ...det.agents.filter((x) => x.parent === m.id)]), ...det.agents.filter((x) => x.kind !== 'main' && !mains.some((m) => m.id === x.parent))];
    for (const x of order) {
      const li = el('li');
      const b = el('button', `agent-btn ${x.kind === 'main' ? '' : 'sub'}`);
      b.type = 'button';
      b.append(el('span', `dot ${x.status}`), el('span', 'n', x.label), el('span', 's', x.step));
      b.onclick = () => selectAgent(x.id);
      b.dataset.pid = 'agent:' + x.id;
      li.append(b);
      ul.append(li);
    }
    body.append(ul);
    return;
  }
  const back = el('button', 'back', 'Todos os agentes');
  back.type = 'button';
  back.onclick = () => selectAgent(null);
  head.append(back, el('h3', null, a.label), el('p', null, `${STATUS_PT[a.status] || a.status}: ${a.step}`));
  const dl = el('dl', 'facts');
  const fact = (k, v) => v != null && v !== '' && dl.append(el('dt', null, k), el('dd', null, String(v)));
  fact('Tipo', a.kind === 'main' ? 'Sessão principal' : a.type);
  fact('Skill', a.skill || 'nenhuma');
  fact('Ferramentas', a.tools);
  if (a.errors) fact('Erros', a.errors);
  fact('Início', ago(a.started));
  fact('Último evento', ago(a.last));
  body.append(dl);
  const tl = el('ol', 'timeline');
  tl.setAttribute('aria-label', 'Passos, do mais recente ao mais antigo');
  for (const s of [...a.steps].reverse()) {
    const li = el('li', s.st);
    li.append(el('div', 't', s.step));
    const meta = [s.tool, ago(s.t), s.dur != null ? `${(s.dur / 1000).toFixed(s.dur < 10000 ? 1 : 0)}s` : s.st === 'running' ? 'em andamento' : null].filter(Boolean).join(', ');
    li.append(el('div', 'm', meta));
    if (s.err) li.append(el('div', 'err', s.err));
    tl.append(li);
  }
  body.append(tl);
}

function renderFooter() {
  if (ui.mode === 'live') setConn('Ao vivo', 'live');
  else if (ui.mode === 'demo') setConn('Demonstração', 'demo');
  const r = ui.routes;
  const box = $('#router-stats');
  box.replaceChildren();
  if (r && r.total) {
    const avg = r.injected ? Math.round(r.tokens / r.injected) : 0;
    box.append(document.createTextNode('Roteador de skills: '), el('strong', null, `${r.injected} de ${r.total}`), document.createTextNode(` prompts com skill, ~${avg} tokens por sugestão`));
  }
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    if (!ui.selected && ui.projects.length && matchMedia('(min-width: 901px)').matches) ui.selected = ui.projects[0].id;
    renderProjects();
    renderStage();
    renderFooter();
  });
}

async function selectProject(id) {
  ui.selected = id;
  ui.agent = null;
  scene.select(null);
  await ensureDetail(id);
  render();
}
function selectAgent(id) {
  ui.agent = id;
  scene.select(id);
  render();
}

$('#filter').addEventListener('input', (e) => {
  ui.filter = e.target.value;
  renderProjects();
});
for (const b of document.querySelectorAll('[data-layout]')) {
  b.addEventListener('click', () => {
    for (const x of document.querySelectorAll('[data-layout]')) x.setAttribute('aria-pressed', String(x === b));
    scene.setLayout(b.dataset.layout);
  });
}
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.agent) selectAgent(null);
});

const params = new URLSearchParams(location.search);
if (true) startLocalDemo();
else if (!(await connectLive())) startLocalDemo();
setInterval(render, 5000); // keep relative times fresh
render();

</script>
</body>
</html>
