<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Fleet 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <aside class="projects" aria-label="Chats">
    <header>
      <h1 class="brand">Agent Fleet<small>Seus chats do Claude Code em 3D</small></h1>
      <input class="filter" id="filter" type="search" placeholder="Buscar chats" aria-label="Buscar chats" />
      <div class="list-tools">
        <label>Agrupar
          <select id="group">
            <option value="date">Por data</option>
            <option value="project">Por projeto</option>
            <option value="none">Sem grupos</option>
          </select>
        </label>
        <label>Mostrar
          <select id="show">
            <option value="all">Todos</option>
            <option value="active">Ativos agora</option>
            <option value="pipeline">Com pipeline</option>
            <option value="plain">Sem pipeline</option>
            <option value="errors">Com erros</option>
          </select>
        </label>
      </div>
    </header>
    <div class="chat-list" id="chats"></div>
    <footer>
      <div><span class="conn" id="conn">Conectando…</span> <span id="count"></span></div>
      <div id="router-stats" style="margin-top:6px"></div>
    </footer>
  </aside>

  <main class="stage">
    <div id="scene-history" class="scene-host" aria-hidden="true"></div>
    <div id="scene" class="scene-host" aria-hidden="true" hidden></div>
    <div class="overlay tip" id="tip" hidden></div>

    <div class="overlay title" id="title" hidden>
      <h2 id="p-name"></h2>
      <p id="p-root"></p>
      <div class="chips" id="p-chips"></div>
    </div>

    <div class="overlay top-actions">
      <div class="views" role="group" aria-label="Visualização" id="views" hidden>
        <button type="button" data-view="history" aria-pressed="true">Histórico</button>
        <button type="button" data-view="pipeline" aria-pressed="false">Pipeline</button>
      </div>
      <button type="button" class="recenter" id="recenter" hidden>Recentrar câmera</button>
    </div>

    <div class="overlay placeholder" id="placeholder">
      <p>Escolha um chat na coluna da esquerda para ver o histórico dele em 3D.</p>
    </div>

    <section class="overlay drawer" id="drawer" aria-label="Detalhes do chat" hidden>
      <div class="head" id="d-head"></div>
      <div class="body" id="d-body"></div>
    </section>

    <div class="overlay legend" id="legend-history" aria-hidden="true">
      <span><i style="background:var(--focus)"></i>Prompt</span>
      <span><i style="background:var(--ink-3)"></i>Leitura</span>
      <span><i style="background:var(--thinking)"></i>Edição</span>
      <span><i style="background:var(--running)"></i>Comando</span>
      <span><i style="background:var(--waiting)"></i>Web</span>
      <span><i style="background:var(--ink)"></i>Subagente</span>
      <span><i style="background:var(--error)"></i>Erro</span>
    </div>
    <div class="overlay legend" id="legend-pipeline" aria-hidden="true" hidden>
      <span><i style="background:var(--idle)"></i>Aguardando</span>
      <span><i style="background:var(--running)"></i>Em andamento</span>
      <span><i style="background:var(--thinking)"></i>Concluído</span>
      <span><i style="background:var(--error)"></i>Reprovado ou erro</span>
      <span><i style="background:var(--waiting)"></i>Aguardando você</span>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
