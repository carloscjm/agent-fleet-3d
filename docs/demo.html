<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Fleet 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
:root {
  --sky: #0f2236;
  --sky-deep: #0a1828;
  --panel: #15304b;
  --panel-2: #1b3a59;
  --line: rgba(143, 179, 217, 0.22);
  --line-strong: rgba(143, 179, 217, 0.45);
  --ink: #e8eff7;
  --ink-2: #a9bdd3;
  --ink-3: #7690ad;
  --running: #f2b33d;
  --thinking: #7fd1c7;
  --waiting: #e58ac0;
  --error: #f2665c;
  --idle: #6f86a3;
  --focus: #ffd98a;
  --font-ui: 'Barlow', system-ui, sans-serif;
  --font-head: 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
  --font-code: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --sky: #e9f0f7;
    --sky-deep: #dde7f1;
    --panel: #f6f9fc;
    --panel-2: #ffffff;
    --line: rgba(29, 53, 87, 0.16);
    --line-strong: rgba(29, 53, 87, 0.35);
    --ink: #142a44;
    --ink-2: #3c5774;
    --ink-3: #647d99;
    --running: #c98500;
    --thinking: #138a7d;
    --waiting: #b8448a;
    --error: #d1453b;
    --idle: #7a8ea6;
    --focus: #b36b00;
    color-scheme: light;
  }
}
:root[data-theme='light'] {
  --sky: #e9f0f7;
  --sky-deep: #dde7f1;
  --panel: #f6f9fc;
  --panel-2: #ffffff;
  --line: rgba(29, 53, 87, 0.16);
  --line-strong: rgba(29, 53, 87, 0.35);
  --ink: #142a44;
  --ink-2: #3c5774;
  --ink-3: #647d99;
  --running: #c98500;
  --thinking: #138a7d;
  --waiting: #b8448a;
  --error: #d1453b;
  --idle: #7a8ea6;
  --focus: #b36b00;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sky);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  display: grid;
  grid-template-columns: 300px 1fr;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- project column ---------- */
.projects {
  background: var(--panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.projects header { padding: 20px 20px 12px; }
.brand { font: 600 21px/1.1 var(--font-head); letter-spacing: 0.01em; margin: 0; }
.brand small { display: block; font: 400 13px/1.4 var(--font-ui); color: var(--ink-3); margin-top: 4px; }
.filter {
  margin-top: 14px;
  width: 100%;
  background: var(--sky-deep);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--ink);
  font: inherit;
}
.filter::placeholder { color: var(--ink-3); }
.project-list { list-style: none; margin: 0; padding: 4px 10px 16px; overflow-y: auto; flex: 1; }
.project {
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-radius: 8px;
  padding: 11px 12px 11px 14px;
  cursor: pointer;
  position: relative;
  display: grid;
  gap: 3px;
}
.project:hover { background: color-mix(in srgb, var(--panel-2) 70%, transparent); }
.project[aria-current='true'] { background: var(--panel-2); }
.project[aria-current='true']::before {
  content: '';
  position: absolute;
  left: 0; top: 10px; bottom: 10px;
  width: 3px;
  border-radius: 2px;
  background: var(--running);
}
.project .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.project .name { font: 600 16px/1.2 var(--font-head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.project .when { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.project .step { font: 12px/1.35 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 5px; align-items: center; height: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
.dot.sub { width: 5px; height: 5px; }
.dot.running { background: var(--running); box-shadow: 0 0 8px var(--running); }
.dot.thinking { background: var(--thinking); }
.dot.waiting { background: var(--waiting); }
.dot.error { background: var(--error); }
.dots .count { font-size: 12px; color: var(--ink-3); margin-left: 4px; }
.empty { padding: 18px 20px; color: var(--ink-2); font-size: 14px; }
.empty button, .linkish {
  background: none; border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 7px 12px; margin-top: 12px; cursor: pointer;
}
.projects footer {
  border-top: 1px solid var(--line);
  padding: 12px 20px 16px;
  font-size: 12.5px;
  color: var(--ink-3);
}
.projects footer strong { color: var(--ink-2); font-weight: 600; }
.conn { display: inline-flex; align-items: center; gap: 6px; }
.conn::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
.conn.live::before { background: var(--thinking); }
.conn.demo::before { background: var(--waiting); }

/* ---------- stage ---------- */
.stage { position: relative; min-width: 0; min-height: 0; }
#scene { position: absolute; inset: 0; }
#scene canvas { display: block; }
.overlay { position: absolute; pointer-events: none; }
.overlay > * { pointer-events: auto; }
.title { top: 20px; left: 24px; max-width: 50%; }
.title h2 { margin: 0; font: 600 30px/1.1 var(--font-head); }
.title p { margin: 4px 0 0; font: 12.5px var(--font-code); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 12.5px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line-strong); color: var(--ink-2);
  background: color-mix(in srgb, var(--sky) 70%, transparent);
}
.chip b { font-weight: 600; color: var(--ink); }
.chip.running { border-color: var(--running); }
.chip.waiting { border-color: var(--waiting); }
.chip.error { border-color: var(--error); }


.legend {
  bottom: 18px; left: 24px;
  display: flex; gap: 14px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--ink-2);
}
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

.placeholder {
  inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-2);
  pointer-events: none;
}
.placeholder p { max-width: 34ch; margin: 0; }


/* ---------- drawer ---------- */
.drawer {
  position: absolute; top: 76px; right: 24px; bottom: 18px;
  width: 330px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex; flex-direction: column;
  min-height: 0;
  backdrop-filter: blur(6px);
}
.drawer h3 { margin: 0; font: 600 17px/1.2 var(--font-head); }
.drawer .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.drawer .head p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
.drawer .body { overflow-y: auto; padding: 8px 8px 14px; flex: 1; }
.agents { list-style: none; margin: 0; padding: 0; }
.agent-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px;
  padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center;
}
.agent-btn:hover { background: var(--panel-2); }
.agent-btn .dot { grid-row: span 2; }
.agent-btn .n { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn .s { font: 12px var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-btn.sub { padding-left: 26px; }
.back { background: none; border: 0; padding: 0 0 6px; color: var(--ink-3); cursor: pointer; font-size: 13px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 8px 6px; font-size: 13px; }
.facts dt { color: var(--ink-3); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0 8px; position: relative; }
.timeline li { position: relative; padding: 6px 0 6px 18px; border-left: 1px solid var(--line); }
.timeline li::before {
  content: ''; position: absolute; left: -4px; top: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--idle);
}
.timeline li.running::before { background: var(--running); box-shadow: 0 0 8px var(--running); }
.timeline li.error::before { background: var(--error); }
.timeline li.done::before { background: var(--thinking); }
.timeline .t { font: 12px/1.35 var(--font-code); overflow-wrap: anywhere; }
.timeline .m { font-size: 11.5px; color: var(--ink-3); }
.timeline .err { color: var(--error); font-size: 12px; }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: 220px 1fr; }
  .projects { border-right: 0; border-bottom: 1px solid var(--line); }
  .projects footer { display: none; }
  .drawer { top: auto; left: 16px; right: 16px; width: auto; height: 40%; }
  .title { left: 16px; max-width: 70%; }
  .title h2 { font-size: 22px; }
  .recenter { right: 16px; }
  .legend { display: none; }
}

[hidden] { display: none !important; }
#scene { z-index: 0; isolation: isolate; }
.overlay { z-index: 2; }

/* ---------- pipeline bar (project list + drawer) ---------- */
.pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 2px; }
.pipe .seg { display: grid; gap: 3px; font-size: 11px; color: var(--ink-3); min-width: 0; }
.pipe .seg i { display: block; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--idle) 45%, transparent); }
.pipe .seg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe .seg.active i { background: var(--running); box-shadow: 0 0 6px var(--running); }
.pipe .seg.active span { color: var(--ink); font-weight: 600; }
.pipe .seg.done i { background: var(--thinking); }
.pipe .seg.failed i { background: var(--error); }
.pipe .seg.stale i { background: var(--idle); }
.pstatus { font-size: 12.5px; color: var(--ink-2); }
.pstatus.blocked { color: var(--error); }
.pstatus.complete { color: var(--thinking); }

/* ---------- labels in the 3D flow ---------- */
.fcard {
  font: 12px/1.3 var(--font-ui);
  color: var(--ink);
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  border: 1px solid var(--line-strong);
  border-top: 3px solid var(--idle);
  border-radius: 7px;
  padding: 5px 9px 6px;
  max-width: 168px;
  text-align: center;
  white-space: nowrap;
  pointer-events: auto;
  cursor: pointer;
  margin-bottom: 6px;
}
.fcard .n { font: 600 13.5px/1.2 var(--font-head); }
.fcard .t { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.fcard .s { font: 11.5px/1.3 var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.fcard .m { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.fcard.quiet { opacity: 0.72; padding: 3px 8px; }
.fcard.quiet .n { font-size: 12px; }
.fcard.stage.active { border-top-color: var(--running); }
.fcard.stage.active.waiting { border-top-color: var(--waiting); }
.fcard.stage.active.error { border-top-color: var(--error); }
.fcard.stage.done, .fcard.git.done { border-top-color: var(--thinking); }
.fcard.stage.failed { border-top-color: var(--error); }
.fcard.origin { border-top-color: var(--focus); margin: 6px 0 0; }
.fcard.git { margin: 6px 0 0; }
.fcard.origin.waiting { border-top-color: var(--waiting); }
.fcard.git { cursor: default; }
.fcard.rework { border-top-color: var(--waiting); cursor: default; font-size: 11.5px; }
.fcard.rework.hot { border-top-color: var(--error); }
.fcard.sel { border-color: var(--ink); }

.recenter {
  top: 20px; right: 24px;
  background: color-mix(in srgb, var(--panel) 85%, transparent);
  border: 1px solid var(--line-strong); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; color: var(--ink-2);
}
.recenter:hover { color: var(--ink); }

/* ---------- drawer: flows and stages ---------- */
.flow { border: 1px solid var(--line); border-radius: 9px; padding: 8px; margin: 6px 4px 10px; }
.flow.focus { border-color: var(--line-strong); background: color-mix(in srgb, var(--panel-2) 55%, transparent); }
.flow-head { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; background: none; border: 0; padding: 2px 4px; cursor: pointer; text-align: left; }
.flow-head .n { font: 600 15px/1.2 var(--font-head); }
.flow .task { margin: 2px 4px 6px; font-size: 13px; color: var(--ink-2); }
.hint { margin: 4px 4px; font-size: 12.5px; color: var(--ink-3); }
.hint.pad, .sub-h.pad { margin: 10px 12px; }
.sub-h { margin: 10px 4px 2px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: st; }
.stage-btn {
  width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; cursor: pointer;
  padding: 6px 8px; display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
}
.stage-btn:hover { background: var(--panel-2); }
.stage-btn .dot { background: var(--idle); opacity: .55; }
.stage-btn.active .dot { background: var(--running); box-shadow: 0 0 8px var(--running); opacity: 1; }
.stage-btn.done .dot { background: var(--thinking); opacity: 1; }
.stage-btn.failed .dot { background: var(--error); opacity: 1; }
.stage-btn .n { font-weight: 600; font-size: 14px; }
.stage-btn.pending .n { color: var(--ink-3); font-weight: 500; }
.stage-btn .m { font-size: 12px; color: var(--ink-3); text-align: right; max-width: 150px; }
.stage-btn .s { grid-column: 2 / -1; font: 12px var(--font-code); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-btn .s.fail { color: var(--error); }
.stage-btn .s.pass { color: var(--thinking); }

</style>

      "imports": {

<body>
  <aside class="projects" aria-label="Projetos">
    <header>
      <h1 class="brand">Agent Fleet<small>Pipeline de agentes em 3D</small></h1>
      <input class="filter" id="filter" type="search" placeholder="Filtrar projetos" aria-label="Filtrar projetos" />
    </header>
    <ul class="project-list" id="projects"></ul>
    <footer>
      <div><span class="conn" id="conn">Conectando…</span></div>
      <div id="router-stats" style="margin-top:6px"></div>
    </footer>
  </aside>

  <main class="stage">
    <div id="scene" aria-hidden="true"></div>

    <div class="overlay title" id="title" hidden>
      <h2 id="p-name"></h2>
      <p id="p-root"></p>
      <div class="chips" id="p-chips"></div>
    </div>

    <button type="button" class="overlay recenter" id="recenter" hidden>Recentrar câmera</button>

    <div class="overlay placeholder" id="placeholder">
      <p>Escolha um projeto na coluna da esquerda para ver o pipeline dele em 3D.</p>
    </div>

    <section class="overlay drawer" id="drawer" aria-label="Pipeline do projeto" hidden>
      <div class="head" id="d-head"></div>
      <div class="body" id="d-body"></div>
    </section>

    <div class="overlay legend" aria-hidden="true">
      <span><i style="background:var(--idle)"></i>Aguardando</span>
      <span><i style="background:var(--running)"></i>Em andamento</span>
      <span><i style="background:var(--thinking)"></i>Concluído</span>
      <span><i style="background:var(--error)"></i>Reprovado ou erro</span>
      <span><i style="background:var(--waiting)"></i>Aguardando você</span>
    </div>
  </main>

  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
const { ACTIVE_WINDOW_MS, STALE_MS, SUB_LINGER_MS, STAGES, stageOf, verdictOf, createState, apply, effectiveStatus, listProjects, projectDetail, startDemo } = (() => {
// Isomorphic state reducer for agent telemetry events (runs in Node and in the browser).
const ACTIVE_WINDOW_MS = 60 * 60 * 1000; // project stays listed for 1h after last activity
const STALE_MS = 15 * 60 * 1000; // agent with no events for 15 min shows as stale
const SUB_LINGER_MS = 2 * 60 * 1000; // finished generic subagents leave the view after 2 min
const MAX_STEPS = 40;

// ---------------------------------------------------------------------------
// Delivery pipeline: Tech Lead → Engenheiro → QA → DevOps
const STAGES = [
  { key: 'plan', role: 'tech-lead', label: 'Tech Lead', verb: 'Planeja a execução' },
  { key: 'build', role: 'engineer', label: 'Engenheiro', verb: 'Implementa o plano' },
  { key: 'test', role: 'qa', label: 'QA', verb: 'Testa os critérios' },
  { key: 'ship', role: 'devops', label: 'DevOps', verb: 'Sobe para o git' },
];
const STAGE_PATTERNS = [
  ['plan', /^(tech-?lead|tech_lead|techlead)$/],
  ['build', /^(engineer|engenheiro|developer|dev)$/],
  ['test', /^(qa|tester|quality|quality-assurance)$/],
  ['ship', /^(devops|dev-ops|release|release-manager)$/],
];
/** Maps a subagent type ("agent-fleet-3d:tech-lead", "qa", …) to a pipeline stage key, or null. */
function stageOf(type) {
  const t = String(type || '').toLowerCase().split(':').pop().trim();
  for (const [key, re] of STAGE_PATTERNS) if (re.test(t)) return key;
  return null;
}
/** Reads the QA verdict from a final message. */
function verdictOf(text) {
  const s = String(text || '');
  const m = s.match(/VEREDITO:\s*(APROVADO|REPROVADO)/i);
  if (m) return m[1].toUpperCase() === 'APROVADO' ? 'pass' : 'fail';
  if (/\b(REPROVADO|FAILED|FAIL)\b/i.test(s)) return 'fail';
  if (/\b(APROVADO|PASSED|PASS)\b/i.test(s)) return 'pass';
  return null;
}

function createState() {
  return { projects: new Map(), routes: { total: 0, injected: 0, tokens: 0, bySkill: {} }, version: 0 };
}

function project(state, p) {
  let pr = state.projects.get(p.id);
  if (!pr) {
    pr = { id: p.id, name: p.name, root: p.root, last: 0, agents: new Map() };
    state.projects.set(p.id, pr);
  }
  return pr;
}

function agent(pr, id, init) {
  let a = pr.agents.get(id);
  if (!a) {
    a = {
      id,
      parent: null,
      kind: 'main',
      type: 'main',
      stage: null,
      label: 'Sessão principal',
      status: 'ready',
      step: 'Sessão iniciada',
      tool: null,
      skill: null,
      verdict: null,
      result: null,
      steps: [],
      started: init.t,
      ended: null,
      last: init.t,
      tools: 0,
      errors: 0,
      pending: [],
      ...init.fields,
    };
    pr.agents.set(id, a);
  }
  return a;
}

function pushStep(a, s) {
  a.steps.push(s);
  if (a.steps.length > MAX_STEPS) a.steps.splice(0, a.steps.length - MAX_STEPS);
}

/** Apply one raw hook event. Returns the touched project id (or null). */
function apply(state, ev) {
  if (!ev || !ev.proj || !ev.sid) return null;
  const pr = project(state, ev.proj);
  pr.last = Math.max(pr.last, ev.t);
  const main = agent(pr, ev.sid, { t: ev.t, fields: { label: `Sessão ${ev.sid.slice(0, 4)}` } });

  let a = main;
  if (ev.aid && ev.aid !== ev.sid) {
    const stage = stageOf(ev.at);
    const st = STAGES.find((s) => s.key === stage);
    a = agent(pr, ev.aid, {
      t: ev.t,
      fields: { parent: ev.sid, kind: 'sub', type: ev.at || 'subagent', stage, label: st ? st.label : ev.at || 'subagent' },
    });
  }
  a.last = Math.max(a.last, ev.t);
  state.version++;

  switch (ev.e) {
    case 'SessionStart':
      a.status = 'ready';
      a.step = ev.source === 'resume' ? 'Sessão retomada' : 'Sessão iniciada';
      break;
    case 'UserPromptSubmit':
      a.status = 'thinking';
      a.step = ev.step || 'Novo prompt';
      pushStep(a, { t: ev.t, tool: 'Prompt', step: a.step, st: 'done' });
      break;
    case 'Route': {
      state.routes.total++;
      if (ev.mode === 'single' || ev.mode === 'shortlist') {
        state.routes.injected++;
        state.routes.tokens += ev.tokens || 0;
        for (const s of ev.skills || []) state.routes.bySkill[s] = (state.routes.bySkill[s] || 0) + 1;
        a.skill = ev.skills?.[0] || a.skill;

    case 'PreToolUse':

      a.step = ev.step || ev.tool;
      a.tool = ev.tool;
      a.tools++;
      if (ev.skill) a.skill = ev.skill;
      if (ev.delegate) a.pending.push(ev.delegate);
      pushStep(a, { t: ev.t, id: ev.tuid, tool: ev.tool, step: a.step, st: 'running' });
      break;
    case 'PostToolUse':
    case 'PostToolUseFailure': {
      const s = [...a.steps].reverse().find((x) => (ev.tuid ? x.id === ev.tuid : x.st === 'running'));
      const failed = ev.e === 'PostToolUseFailure';
      if (s) {
        s.st = failed ? 'error' : 'done';
        s.dur = ev.t - s.t;
        if (failed) s.err = ev.err;
      }
      if (failed) a.errors++;
      if (a.status !== 'done') a.status = failed ? 'error' : 'thinking';
      if (!a.steps.some((x) => x.st === 'running')) a.tool = null;
      break;
    }
    case 'Notification':
    case 'PermissionRequest':
      a.status = 'waiting';
      a.step = ev.step || 'Aguardando entrada';
      break;
    case 'SubagentStart': {

      const d = i >= 0 ? main.pending.splice(i, 1)[0] : main.pending.shift();

        a.status = 'thinking';
        a.step = d?.desc ? `Iniciando: ${d.desc}` : 'Iniciando';
        if (d?.desc && !a.stage) a.label = `${a.type}: ${d.desc}`;
        if (d?.desc) a.task = d.desc;
      }
      break;
    }
    case 'SubagentStop':
      a.status = 'done';
      a.ended = ev.t;
      a.step = 'Concluído';
      if (ev.msg) a.result = ev.msg;
      if (a.stage === 'test') a.verdict = ev.verdict || verdictOf(ev.msg);
      if (a.stage === 'test' && a.verdict) a.step = a.verdict === 'pass' ? 'Aprovado' : 'Reprovado';
      for (const s of a.steps) if (s.st === 'running') s.st = 'done';
      a.tool = null;
      break;
    case 'Stop':
      a.status = a.kind === 'main' ? 'idle' : 'done';
      a.step = a.kind === 'main' ? 'Aguardando você' : 'Concluído';
      a.tool = null;
      break;
    case 'SessionEnd':
      for (const x of pr.agents.values()) if (x.id === ev.sid || x.parent === ev.sid) x.status = 'ended';
      break;
    default:
      break;
  }
  return pr.id;

function effectiveStatus(a, now) {
  if (['done', 'ended', 'idle'].includes(a.status)) return a.status;
  return now - a.last > STALE_MS ? 'stale' : a.status;

// Pipeline runs, derived from the stage subagents of each main session.
function runsOf(pr, sid) {
  const subs = [...pr.agents.values()].filter((a) => a.parent === sid && a.stage).sort((x, y) => x.started - y.started);
  const runs = [];
  let cur = null;
  for (const a of subs) {
    const newRun = !cur || (a.stage === 'plan' && cur.pastPlan) || (cur.shipped && a.stage !== 'ship');
    if (newRun) {
      cur = { started: a.started, stages: { plan: [], build: [], test: [], ship: [] }, pastPlan: false, shipped: false };
      runs.push(cur);
    }
    cur.stages[a.stage].push(a);
    if (a.stage !== 'plan') cur.pastPlan = true;
    if (a.stage === 'ship' && a.status === 'done') cur.shipped = true;
  }
  return runs;
}

function summarizeRun(run, now, index) {
  const stages = STAGES.map((def) => {
    const attempts = run.stages[def.key];
    const last = attempts[attempts.length - 1];
    if (!last) return { key: def.key, label: def.label, verb: def.verb, status: 'pending', attempts: 0 };
    const ast = effectiveStatus(last, now);
    let status = LIVE.has(ast) ? 'active' : ast === 'stale' ? 'stale' : 'done';
    if (status === 'done' && def.key === 'test' && last.verdict === 'fail') status = 'failed';
    const first = attempts[0];
    return {
      key: def.key,
      label: def.label,
      verb: def.verb,
      status,
      agentId: last.id,
      agentStatus: ast,
      step: last.step,
      skill: last.skill,
      verdict: last.verdict,
      result: last.result,
      attempts: attempts.length,
      started: first.started,
      ended: status === 'done' || status === 'failed' ? last.ended || last.last : null,
      dur: (status === 'active' ? now : last.ended || last.last) - first.started,
      tools: attempts.reduce((n, a) => n + a.tools, 0),
      errors: attempts.reduce((n, a) => n + a.errors, 0),
      steps: last.steps.slice(-8).map(({ tool, step, st, dur }) => ({ tool, step, st, dur })),
      history: attempts.map((a) => ({ id: a.id, status: effectiveStatus(a, now), verdict: a.verdict })),
    };
  });
  const active = stages.find((s) => s.status === 'active');
  const shipped = stages[3].status === 'done';
  const lastTest = stages[2];
  // QA failed and nobody picked the work back up: the run is blocked waiting for a decision.
  const blocked = !active && !shipped && lastTest.status === 'failed';
  const nextIdx = stages.findIndex((s) => s.status === 'pending');
  return {
    n: index + 1,
    started: run.started,
    stages,
    current: active ? active.key : shipped ? 'complete' : blocked ? 'test' : nextIdx >= 0 ? stages[nextIdx].key : null,
    status: shipped ? 'complete' : active ? 'running' : blocked ? 'blocked' : 'waiting',
    reworks: Math.max(0, stages[1].attempts - 1),
    task: (run.stages.plan[0]?.task || run.stages.build[0]?.task || '').replace(/^(Planejar|Implementar|Planear|Plan):\s*/i, '') || null,
  };
}

function flowsOf(pr, now) {
  const mains = [...pr.agents.values()].filter((a) => a.kind === 'main' && (a.status !== 'ended' || now - a.last < ACTIVE_WINDOW_MS));
  return mains
    .map((m) => {
      const runs = runsOf(pr, m.id);
      const run = runs.length ? summarizeRun(runs[runs.length - 1], now, runs.length - 1) : null;
      const others = [...pr.agents.values()].filter((a) => a.parent === m.id && !a.stage);
      return {
        sid: m.id,
        label: m.label,
        status: effectiveStatus(m, now),
        step: m.step,
        skill: m.skill,
        last: m.last,
        started: m.started,
        runs: runs.length,
        completed: runs.filter((r) => r.shipped).length,
        run,
        others: others.filter((a) => effectiveStatus(a, now) !== 'done' || now - a.last < SUB_LINGER_MS).map((a) => a.id),
      };
    })
    // stable order (oldest session first) so rows don't jump around as activity changes
    .sort((x, y) => (y.run ? 1 : 0) - (x.run ? 1 : 0) || x.started - y.started);
}

function listProjects(state, now = Date.now(), { includeInactive = false } = {}) {
  const out = [];
  for (const pr of state.projects.values()) {
    const counts = { running: 0, thinking: 0, waiting: 0, error: 0, idle: 0, done: 0, stale: 0, ready: 0, ended: 0 };
    let live = 0;
    for (const a of pr.agents.values()) {
      const st = effectiveStatus(a, now);
      counts[st] = (counts[st] || 0) + 1;
      if (LIVE.has(st)) live++;
    }
    const active = live > 0 || now - pr.last < ACTIVE_WINDOW_MS;
    if (!active && !includeInactive) continue;
    const lead = [...pr.agents.values()].sort((x, y) => y.last - x.last)[0];
    const flow = flowsOf(pr, now).find((f) => f.run);
    const pipe = flow ? { status: flow.run.status, current: flow.run.current, stages: flow.run.stages.map((s) => s.status), reworks: flow.run.reworks } : null;
    out.push({ id: pr.id, name: pr.name, root: pr.root, last: pr.last, total: pr.agents.size, live, counts, active, step: lead?.step || '', pipe });
  }
  return out.sort((x, y) => y.live - x.live || y.last - x.last);
}

function projectDetail(state, id, now = Date.now()) {
  const pr = state.projects.get(id);
  if (!pr) return null;
  const flows = flowsOf(pr, now);
  const keep = new Set();
  for (const f of flows) {
    keep.add(f.sid);
    for (const o of f.others) keep.add(o);
    if (f.run) for (const s of f.run.stages) for (const h of s.history || []) keep.add(h.id);
  }
  const agents = [...pr.agents.values()]
    .filter((a) => keep.has(a.id) || (a.kind === 'sub' && !a.stage && effectiveStatus(a, now) !== 'done'))
    .map(({ pending, ...a }) => ({ ...a, status: effectiveStatus(a, now), steps: a.steps.slice(-25) }));
  return { id: pr.id, name: pr.name, root: pr.root, last: pr.last, flows, agents };
}

    emit({ t, e: 'UserPromptSubmit', sid: s.sid, proj: s.proj, step: `Prompt: /agent-fleet-3d:pipeline ${task}` });
    emit({ t, e: 'Route', sid: s.sid, proj: s.proj, mode: 'single', skills: ['tlc-plan'], tokens: 58 });

  function startStage(s, key, t) {
    const role = { plan: 'tech-lead', build: 'engineer', test: 'qa', ship: 'devops' }[key];
    const aid = `a${(n++).toString(36)}${Math.floor(rand() * 1e5).toString(36)}`;
    const at = `agent-fleet-3d:${role}`;
    const tuid = `d${aid}`;
    const desc = { plan: `Planejar: ${s.taskName}`, build: s.failedOnce && s.reworkPending ? 'Retrabalho do QA' : `Implementar: ${s.taskName}`, test: `Testar: ${s.taskName}`, ship: 'Subir para o git' }[key];
    emit({ t, e: 'PreToolUse', sid: s.sid, proj: s.proj, tool: 'Agent', tuid, step: `Delegando: ${desc}`, delegate: { type: at, desc } });
    emit({ t, e: 'SubagentStart', sid: s.sid, proj: s.proj, aid, at });
    s.stage = { key, aid, at, tuid, ticks: 0, target: 5 + Math.floor(rand() * 5), open: null };

    if (fast) {
      for (const [tool, step] of STAGE_TOOLS[st.key].slice(0, 3)) {
        const tuid = `t${(n++).toString(36)}`;
        emit({ t, e: 'PreToolUse', sid: s.sid, proj: s.proj, aid: st.aid, at: st.at, tool, step, tuid });
        emit({ t, e: 'PostToolUse', sid: s.sid, proj: s.proj, aid: st.aid, at: st.at, tool, tuid });
      }
    }
    let verdict = null;
    let msg = { plan: 'PLAN.md com 4 tarefas', build: 'Testes passando, IMPLEMENTATION.md escrito', ship: 'PR #42 aberto em feat/retry-idempotente' }[st.key];
    if (st.key === 'test') {
      const fail = !s.failedOnce && rand() < 0.45;
      verdict = fail ? 'fail' : 'pass';
      msg = fail ? '2 critérios falharam\nVEREDITO: REPROVADO' : 'Todos os critérios passaram\nVEREDITO: APROVADO';

    emit({ t, e: 'PostToolUse', sid: s.sid, proj: s.proj, tool: 'Agent', tuid: st.tuid });
    s.stage = null;
    if (st.key === 'test' && verdict === 'fail') {
      s.reworkPending = true;
      return startStage(s, 'build', t);
    }
    const next = ORDER[ORDER.indexOf(st.key) + 1];
    if (next) return startStage(s, next, t);

    s.idleUntil = t + (6000 + rand() * 8000) / speed;

  function cardLabel(cls, onClick) {
    const holder = el('div');
    const card = el('div', 'fcard ' + cls);
    if (onClick) card.addEventListener('click', onClick);
    holder.appendChild(card);
    const obj = new CSS2DObject(holder);
    obj.center.set(0.5, 1);
    return { obj, card };
  }

  function makeRow(flow) {
    const group = new THREE.Group();
    scene.add(group);
    const curvePts = [];
    NODE_X.forEach((x, i) => {
      curvePts.push(new THREE.Vector3(x, NODE_Y, 0));
      if (i < NODE_X.length - 1) curvePts.push(new THREE.Vector3(x + 2.8, NODE_Y + 0.35, 0));
    });
    const curve = new THREE.CatmullRomCurve3(curvePts, false, 'centripetal');
    const nodeU = NODE_X.map((x) => (x - NODE_X[0]) / (NODE_X[NODE_X.length - 1] - NODE_X[0]));
    // u along curve is not linear in x; map by sampling
    const samples = 400;
    const xs = [];
    for (let i = 0; i <= samples; i++) xs.push(curve.getPointAt(i / samples).x);
    const uAtX = (x) => {
      let best = 0;
      for (let i = 0; i <= samples; i++) if (Math.abs(xs[i] - x) < Math.abs(xs[best] - x)) best = i;
      return best / samples;
    };
    for (let i = 0; i < nodeU.length; i++) nodeU[i] = uAtX(NODE_X[i]);

    // conveyor segments
    const segs = [];
    for (let i = 0; i < NODE_X.length - 1; i++) {
      const pts = [];
      for (let k = 0; k <= 24; k++) pts.push(curve.getPointAt(nodeU[i] + ((nodeU[i + 1] - nodeU[i]) * k) / 24));
      const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.075, 8, false);
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.2, transparent: true }));
      group.add(m);
      segs.push(m);
    }

    // flow particles along lit part
    const particles = [];
    for (let i = 0; i < 18; i++) {
      const p = new THREE.Mesh(geo.dot, new THREE.MeshBasicMaterial({ transparent: true }));
      p.userData.offset = i / 18;
      group.add(p);
      particles.push(p);
    }

    // origin (session / orchestrator)
    const origin = new THREE.Mesh(geo.origin, new THREE.MeshStandardMaterial({ roughness: 0.3, emissiveIntensity: 0.6 }));
    origin.position.set(NODE_X[0], NODE_Y + 0.15, 0);
    origin.userData.pick = { kind: 'main', sid: flow.sid };
    group.add(origin);
    pickables.push(origin);
    const originPad = new THREE.Mesh(geo.pad, new THREE.MeshStandardMaterial({ roughness: 0.8, transparent: true, opacity: 0.85 }));
    originPad.position.set(NODE_X[0], -0.5, 0);
    originPad.scale.setScalar(0.75);
    group.add(originPad);
    const originHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false }));
    originHalo.scale.setScalar(2.6);
    originHalo.position.copy(origin.position);
    group.add(originHalo);
    const originLabel = cardLabel('origin', () => onSelect?.(flow.sid));
    originLabel.obj.center.set(0.5, 0);
    originLabel.obj.position.set(NODE_X[0], -0.9, 0.6);
    group.add(originLabel.obj);

    // generic subagents next to the orchestrator
    const otherMeshes = [];

    // stations
    const stations = STAGE_KEYS.map((key, i) => {
      const x = NODE_X[i + 1];
      const sg = new THREE.Group();
      sg.position.set(x, 0, 0);
      group.add(sg);
      const pad = new THREE.Mesh(geo.pad, new THREE.MeshStandardMaterial({ roughness: 0.75, transparent: true }));
      pad.position.y = -0.5;
      sg.add(pad);
      const mat = new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.15, emissiveIntensity: 0.6, transparent: true });
      const body = new THREE.Group();
      const main = new THREE.Mesh(geo[key], mat);
      body.add(main);
      if (key === 'test') {
        const core = new THREE.Mesh(geo.testCore, mat);
        body.add(core);
      }
      if (key === 'ship') main.position.y = 0.1;
      body.position.y = NODE_Y + 0.35;
      sg.add(body);
      for (const m of body.children) {
        m.userData.pick = { kind: 'stage', sid: flow.sid, key };
        pickables.push(m);
      }
      pad.userData.pick = { kind: 'stage', sid: flow.sid, key };
      pickables.push(pad);
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false }));
      halo.scale.setScalar(3.4);
      halo.position.y = NODE_Y + 0.35;
      sg.add(halo);
      const ring = new THREE.Mesh(geo.ring, new THREE.MeshBasicMaterial({ transparent: true }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = -0.36;
      sg.add(ring);
      const slabs = [];
      for (let k = 0; k < MAX_SLABS; k++) {
        const s = new THREE.Mesh(geo.slab, new THREE.MeshBasicMaterial({ transparent: true }));
        s.position.set(0, -0.3 + k * 0.17, -1.85);
        s.visible = false;
        sg.add(s);
        slabs.push(s);
      }
      const label = cardLabel('stage', () => onSelect?.({ sid: flow.sid, key }));
      label.obj.position.set(0, NODE_Y + (i % 2 ? 2.9 : 1.6), 0);
      sg.add(label.obj);
      return { key, sg, pad, body, mat, halo, ring, slabs, label, data: null };
    });

    // git endpoint
    const git = new THREE.Group();
    git.position.set(NODE_X[5], 0, 0);
    group.add(git);
    const gitMat = new THREE.MeshStandardMaterial({ roughness: 0.4, emissiveIntensity: 0.5 });
    for (let k = 0; k < 3; k++) {
      const d = new THREE.Mesh(geo.git, gitMat);
      d.position.y = -0.2 + k * 0.32;
      git.add(d);
    }
    const gitLabel = cardLabel('git');
    gitLabel.obj.center.set(0.5, 0);
    gitLabel.obj.position.set(0, -0.9, 0.6);
    git.add(gitLabel.obj);

    // rework path QA → Engenheiro: a loop on the floor, in front of the conveyor
    const ax0 = NODE_X[3];
    const ax1 = NODE_X[2];
    const arcCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(ax0, -0.3, 1.3),
      new THREE.Vector3(ax0 - 1.2, -0.3, 2.7),
      new THREE.Vector3((ax0 + ax1) / 2, -0.3, 3.1),
      new THREE.Vector3(ax1 + 1.2, -0.3, 2.7),
      new THREE.Vector3(ax1 + 0.15, -0.3, 1.45),
    ]);
    const arcMat = new THREE.MeshBasicMaterial({ transparent: true });
    const arc = new THREE.Mesh(new THREE.TubeGeometry(arcCurve, 60, 0.07, 8, false), arcMat);
    group.add(arc);
    const arcHead = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.5, 12), new THREE.MeshBasicMaterial({ transparent: true }));
    const endP = arcCurve.getPointAt(1);
    const endT = arcCurve.getTangentAt(1);
    arcHead.position.copy(endP);
    arcHead.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), endT);
    group.add(arcHead);
    const arcDots = [];
    for (let i = 0; i < 5; i++) {
      const d = new THREE.Mesh(geo.dot, new THREE.MeshBasicMaterial({ transparent: true }));
      d.scale.setScalar(1.3);
      d.userData.offset = i / 5;
      group.add(d);
      arcDots.push(d);
    }
    const arcLabel = cardLabel('rework');
    arcLabel.obj.center.set(0.5, 0);
    arcLabel.obj.position.set((ax0 + ax1) / 2, -0.3, 3.3);
    group.add(arcLabel.obj);

    // work packet
    const packet = new THREE.Mesh(geo.packet, new THREE.MeshStandardMaterial({ roughness: 0.25, emissiveIntensity: 0.9 }));
    const packetHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, transparent: true, depthWrite: false }));
    packetHalo.scale.setScalar(1.6);
    group.add(packet, packetHalo);

    const row = {
      sid: flow.sid,
      group,
      curve,
      nodeU,
      segs,
      particles,
      origin,
      originPad,
      originHalo,
      originLabel,
      otherMeshes,
      stations,
      git,
      gitMat,
      gitLabel,
      arc,
      arcMat,
      arcCurve,
      arcDots,
      arcHead,
      arcLabel,
      packet,
      packetHalo,
      packetU: 0,
      targetU: 0,
      data: flow,
      z: 0,
      zTarget: 0,
      born: performance.now(),
      dying: 0,
      retheme() {
        originPad.material.color.copy(pal.panel).lerp(pal.line, 0.25);
        for (const s of stations) s.pad.material.color.copy(pal.panel).lerp(pal.line, 0.3);
      },
    };
    row.retheme();
    group.scale.setScalar(0.01);
    return row;
  }

  function disposeRow(r) {
    scene.remove(r.group);
    r.group.traverse((o) => {
      if (o.isCSS2DObject) o.element.remove();
      if (o.material) o.material.dispose?.();
      if (o.geometry && !Object.values(geo).includes(o.geometry)) o.geometry.dispose();
    });
    for (let i = pickables.length - 1; i >= 0; i--) {
      let p = pickables[i];
      while (p && p !== r.group) p = p.parent;
      if (p === r.group) pickables.splice(i, 1);
    }
  }

  // ------------------------------------------------------------ data → row
  function fillCard(card, parts) {
    card.replaceChildren();
    for (const [cls, text] of parts) if (text) card.appendChild(el('div', cls, text));
  }

  function updateRow(row, flow, agentsById) {
    row.data = flow;
    const run = flow.run;
    const isFocus = focused === flow.sid;

    // origin card
    const runText = run ? `${run.task ? run.task : 'Pipeline'}${flow.runs > 1 ? ` · execução ${flow.runs}` : ''}` : 'Sem pipeline';
    fillCard(row.originLabel.card, [
      ['n', flow.label],
      ['t', isFocus ? runText : null],
      ['s', isFocus ? flow.step : null],
    ]);
    row.originLabel.card.className = `fcard origin ${flow.status} ${isFocus ? 'focus' : 'quiet'} ${selected === flow.sid ? 'sel' : ''}`;

    // stations
    row.stations.forEach((st, i) => {
      const s = run ? run.stages[i] : { key: st.key, status: 'pending', attempts: 0, label: ['Tech Lead', 'Engenheiro', 'QA', 'DevOps'][i] };
      st.data = s;
      const label = s.label || ['Tech Lead', 'Engenheiro', 'QA', 'DevOps'][i];
      let line2 = STATUS_PT[s.status];
      if (s.status === 'active') line2 = s.step || 'Em andamento';
      else if (s.status === 'done' && s.key === 'ship' && s.result) line2 = s.result.split('\n').pop();
      else if (s.status === 'done' || s.status === 'failed') line2 = `${STATUS_PT[s.status]} em ${fmtDur(s.dur)}`;
      const meta = [s.attempts > 1 ? (s.key === 'build' ? `retrabalho ${s.attempts - 1}` : `${s.attempts}ª tentativa`) : null, s.skill && isFocus ? `skill ${s.skill}` : null].filter(Boolean).join(' · ');
      fillCard(st.label.card, [
        ['n', label],
        ['s', isFocus ? line2 : null],
        ['m', isFocus ? meta : null],
      ]);
      st.label.obj.position.y = NODE_Y + (isFocus && i % 2 ? 2.9 : 1.6);
      st.label.card.className = `fcard stage ${s.status} ${s.agentStatus || ''} ${isFocus ? 'focus' : 'quiet'} ${selected && s.agentId === selected ? 'sel' : ''}`;
      // activity slabs: newest on top
      const steps = s.steps || [];
      st.slabs.forEach((slab, k) => {
        const step = steps[steps.length - MAX_SLABS + k] || null;
        slab.visible = !!step;
        if (step) {
          slab.material.color.copy(slabColor(step));
          slab.material.opacity = 0.35 + 0.65 * ((k + 1) / MAX_SLABS);
        }
      });
    });

    // git endpoint
    const ship = run?.stages[3];
    const shipped = ship?.status === 'done';
    fillCard(row.gitLabel.card, [
      ['n', 'Git'],
      ['s', shipped ? 'Entregue' : run?.status === 'blocked' ? 'Bloqueado pelo QA' : isFocus ? 'Aguardando DevOps' : null],
      ['m', isFocus && flow.completed ? `${flow.completed} entrega${flow.completed > 1 ? 's' : ''} nesta sessão` : null],
    ]);
    row.gitLabel.card.className = `fcard git ${shipped ? 'done' : 'pending'} ${isFocus ? 'focus' : 'quiet'}`;

    // rework arc
    const reworks = run?.reworks || 0;
    const testFailed = run?.stages[2].status === 'failed';
    row.arc.visible = row.arcHead.visible = reworks > 0 || testFailed;
    row.arcLabel.obj.visible = row.arc.visible && isFocus;
    fillCard(row.arcLabel.card, [['n', testFailed ? (run.stages[1].status === 'active' ? 'Retrabalho em andamento' : 'QA reprovou') : `Retrabalho ×${reworks}`]]);
    row.arcLabel.card.className = `fcard rework ${testFailed ? 'hot' : ''}`;

    // packet target
    const idx = run ? (run.current === 'complete' ? 5 : Math.max(0, STAGE_KEYS.indexOf(run.current)) + 1) : 0;
    row.targetU = row.nodeU[idx];
    row.packetIdx = idx;

    // other agents near the orchestrator
    const others = flow.others.map((id) => agentsById.get(id)).filter(Boolean);
    while (row.otherMeshes.length > others.length) {
      const m = row.otherMeshes.pop();
      row.group.remove(m);
      m.material.dispose();
    }
    while (row.otherMeshes.length < others.length) {
      const m = new THREE.Mesh(geo.other, new THREE.MeshStandardMaterial({ roughness: 0.4, emissiveIntensity: 0.5 }));
      row.group.add(m);
      pickables.push(m);
      row.otherMeshes.push(m);
    }
    others.forEach((a, k) => {
      const m = row.otherMeshes[k];
      m.userData.pick = { kind: 'agent', id: a.id };
      m.userData.status = a.status;
      m.position.set(NODE_X[0] - 1.2 + (k % 5) * 0.6, -0.15, 1.6 + Math.floor(k / 5) * 0.6);
    });
  }

  function setProject(detail) {
    const flows = detail ? detail.flows.slice(0, MAX_ROWS) : [];
    const agentsById = new Map((detail?.agents || []).map((a) => [a.id, a]));
    const keep = new Set(flows.map((f) => f.sid));
    for (const [sid, r] of rows) if (!keep.has(sid) && !r.dying) r.dying = performance.now();
    if (!focused || !keep.has(focused)) focused = flows[0]?.sid || null;
    const projectChanged = detail?.id !== currentProject;
    if (projectChanged) {
      for (const r of rows.values()) disposeRow(r);
      rows.clear();
      currentProject = detail?.id || null;
      selected = null;
    }
    flows.forEach((f, i) => {
      let r = rows.get(f.sid);
      if (!r) {
        r = makeRow(f);
        rows.set(f.sid, r);
      }
      r.dying = 0;
      r.zTarget = -i * ROW_GAP;
      if (projectChanged) r.z = r.zTarget;
      updateRow(r, f, agentsById);
    });
    if (projectChanged || flows.length !== lastRowCount) frame(flows.length);
    lastRowCount = flows.length;
  }
  let currentProject = null;
  let lastRowCount = -1;

  function select(id) {
    selected = id;
  }
  function focusRow(sid) {
    focused = sid;
  }

  // ------------------------------------------------------------ camera
  let fly = null;
  let rightInset = 0;
  // Fit the whole flow (x from -17 to 17 plus labels) in the visible width, left of the drawer.
  function fitDistance(n) {
    const { clientWidth: w, clientHeight: h } = host;
    const visibleW = Math.max(200, w - (w > 900 ? rightInset : 0));
    const aspect = visibleW / Math.max(h, 1);
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
    const halfW = 18.6;
    const depth = (Math.max(1, n) - 1) * ROW_GAP;
    // the front row sits closer to the camera than the target, so it needs the extra margin
    const dW = halfW / Math.tan(hfov / 2) + depth * 0.5 * 0.71;
    const dH = (depth * 0.55 + 6) / Math.tan(vfov / 2);
    return Math.max(dW, dH, 20);
  }
  function frame(n) {
    const depth = Math.max(1, n) - 1;
    const target = new THREE.Vector3(0, 0.8, -depth * ROW_GAP * 0.5);
    const dist = fitDistance(n);
    const pos = new THREE.Vector3(0, dist * 0.7, target.z + dist * 0.71);
    if (reduceMotion) {
      camera.position.copy(pos);
      controls.target.copy(target);
      return;
    }
    fly = { from: camera.position.clone(), fromT: controls.target.clone(), pos, target, t0: performance.now() };
  }
  function recenter() {
    frame(lastRowCount);
  }
  camera.position.set(0, 16, 22);

  // ------------------------------------------------------------ picking
  const ray = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let down = null;
  renderer.domElement.addEventListener('pointerdown', (e) => (down = [e.clientX, e.clientY]));
  renderer.domElement.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const hit = pick(e);
    if (!hit) return onSelect?.(null);
    const p = hit.object.userData.pick;
    if (p.sid) onFocusRow?.(p.sid);
    if (p.kind === 'main') onSelect?.(p.sid);
    else if (p.kind === 'stage') onSelect?.({ sid: p.sid, key: p.key });
    else if (p.kind === 'agent') onSelect?.(p.id);
  });
  renderer.domElement.addEventListener('pointermove', (e) => {
    renderer.domElement.style.cursor = pick(e) ? 'pointer' : '';
  });
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    return ray.intersectObjects(pickables, false).find((h) => h.object.userData.pick);
  }

  // ------------------------------------------------------------ loop
  function resize() {
    const { clientWidth: w, clientHeight: h } = host;
    renderer.setSize(w, h);
    labelRenderer.setSize(w, h);
    camera.aspect = w / Math.max(h, 1);
    if (rightInset && w > 900) camera.setViewOffset(w, h, rightInset / 2, 0, w, h);
    else camera.clearViewOffset();
    camera.updateProjectionMatrix();
  }
  function setInset(px) {
    if (px === rightInset) return;
    rightInset = px;
    resize();
    frame(lastRowCount);
  }
  new ResizeObserver(resize).observe(host);
  resize();

  const clock = new THREE.Clock();
  let simT = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    const dt = Math.min(clock.getDelta(), 0.1);
    if (!reduceMotion) simT += dt;
    const t = simT;
    const k = 1 - Math.exp(-dt * 4);

    if (fly) {
      const u = Math.min(1, (performance.now() - fly.t0) / 1000);
      const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
      camera.position.lerpVectors(fly.from, fly.pos, e);
      controls.target.lerpVectors(fly.fromT, fly.target, e);
      if (u >= 1) fly = null;
    }

    const now = performance.now();
    for (const [sid, r] of rows) {
      // enter / leave
      if (r.dying) {
        const u = (now - r.dying) / 600;
        r.group.scale.setScalar(Math.max(0.01, 1 - u));
        if (u >= 1) {
          disposeRow(r);
          rows.delete(sid);
          continue;
        }
      } else {
        const s = r.group.scale.x;
        r.group.scale.setScalar(s + (1 - s) * Math.min(1, k * 1.5));
      }
      r.z += (r.zTarget - r.z) * k;
      r.group.position.z = r.z;
      const isFocus = focused === sid;
      const run = r.data.run;

      // origin
      const ost = r.data.status;
      const oc = ost === 'waiting' ? pal.waiting : ost === 'running' ? pal.running : ost === 'thinking' ? pal.thinking : pal.idle;
      r.origin.material.color.copy(oc);
      r.origin.material.emissive.copy(oc).multiplyScalar(['idle', 'done', 'ended', 'stale'].includes(ost) ? 0.12 : 0.5);
      r.originHalo.material.color.copy(oc);
      r.originHalo.material.opacity = (ost === 'waiting' && !reduceMotion ? 0.35 + 0.35 * Math.sin(t * 4) : 0.3) * (light ? 0.6 : 1);
      r.originPad.material.opacity = isFocus ? 0.95 : 0.6;

      // conveyor segments: a segment lights once the station it leads to has started
      r.segs.forEach((seg, i) => {
        const nextStage = i < 4 ? run?.stages[i] : run?.stages[3];
        const lit = i < 4 ? nextStage && nextStage.status !== 'pending' : nextStage?.status === 'done';
        const failedSeg = i === 3 && run?.stages[2].status === 'failed';
        const c = failedSeg ? pal.error : lit ? pal.thinking : pal.idle;
        seg.material.color.copy(c);
        seg.material.emissive = seg.material.emissive || new THREE.Color();
        seg.material.emissive.copy(c).multiplyScalar(lit ? 0.35 : 0);
        seg.material.opacity = lit ? 0.95 : isFocus ? 0.45 : 0.3;
      });

      // particles flow from the session to the current station
      const uMax = r.nodeU[r.packetIdx ?? 0];
      r.particles.forEach((p) => {
        const has = uMax > 0.001 && !reduceMotion && run && run.status !== 'complete';
        p.visible = has;
        if (!has) return;
        const u = ((p.userData.offset + t * 0.12) % 1) * uMax;
        p.position.copy(r.curve.getPointAt(u));
        p.material.color.copy(pal.running);
        p.material.opacity = 0.35 + 0.65 * (u / uMax);
      });

      // stations
      r.stations.forEach((st, i) => {
        const s = st.data || { status: 'pending' };
        const c = stageColor(s);
        const quiet = s.status === 'pending';
        st.mat.color.copy(c);
        st.mat.emissive.copy(c).multiplyScalar(quiet ? 0.05 : s.status === 'active' ? 0.55 : 0.3);
        st.mat.opacity = quiet ? 0.45 : 1;
        st.halo.material.color.copy(c);
        let ho = quiet ? 0 : s.status === 'active' ? 0.6 : 0.25;
        if (!reduceMotion && s.status === 'active') {
          ho = s.agentStatus === 'waiting' ? 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(t * 4)) : 0.45 + 0.15 * Math.sin(t * 3 + i);
          st.body.rotation.y += dt * (s.agentStatus === 'running' ? 1.6 : 0.6);
          st.body.position.y = NODE_Y + 0.35 + Math.sin(t * 2.2 + i) * 0.08;
        } else if (!reduceMotion) st.body.rotation.y += dt * 0.1;
        if (selected && s.agentId === selected) ho = Math.max(ho, 0.85);
        st.halo.material.opacity = ho * (light ? 0.6 : 1);
        st.ring.visible = s.status === 'active';
        st.ring.material.color.copy(c);
        if (!reduceMotion) st.ring.rotation.z += dt * 1.8;
        st.pad.material.opacity = isFocus ? 0.95 : 0.6;
      });

      // git
      const shipped = run?.stages[3].status === 'done';
      r.gitMat.color.copy(shipped ? pal.thinking : pal.idle);
      r.gitMat.emissive.copy(shipped ? pal.thinking : pal.idle).multiplyScalar(shipped ? 0.4 : 0.05);

      // rework path
      const hot = run?.stages[2].status === 'failed';
      for (const d of r.arcDots) d.visible = r.arc.visible && hot && !reduceMotion;
      if (r.arc.visible) {
        const c = hot ? pal.error : pal.waiting;
        r.arcMat.color.copy(c);
        r.arcMat.opacity = hot ? 0.95 : 0.45;
        r.arcHead.material.color.copy(c);
        r.arcHead.material.opacity = r.arcMat.opacity;
        if (hot && !reduceMotion)
          for (const d of r.arcDots) {
            d.position.copy(r.arcCurve.getPointAt((d.userData.offset + t * 0.35) % 1));
            d.material.color.copy(pal.error);
          }
      }

      // packet travels along the conveyor to the current station
      r.packetU += (r.targetU - r.packetU) * Math.min(1, dt * 1.6);
      const pp = r.curve.getPointAt(Math.min(1, Math.max(0, r.packetU)));
      const bob = reduceMotion ? 0 : Math.sin(t * 3) * 0.08;
      r.packet.position.set(pp.x, pp.y + 0.55 + bob + (r.packetIdx > 0 && r.packetIdx < 5 ? 1.45 : 0.35), pp.z);
      if (!reduceMotion) r.packet.rotation.set(t * 0.9, t * 1.2, 0);
      const pc = run?.status === 'blocked' ? pal.error : run?.status === 'complete' ? pal.thinking : pal.focus;
      r.packet.material.color.copy(pc);
      r.packet.material.emissive.copy(pc).multiplyScalar(0.7);
      r.packet.visible = !!run;
      r.packetHalo.visible = !!run;
      r.packetHalo.position.copy(r.packet.position);
      r.packetHalo.material.color.copy(pc);
      r.packetHalo.material.opacity = light ? 0.4 : 0.7;

      // other agents
      for (const m of r.otherMeshes) {
        const st = m.userData.status;
        const c = st === 'running' ? pal.running : st === 'waiting' ? pal.waiting : st === 'error' ? pal.error : st === 'thinking' ? pal.thinking : pal.idle;
        m.material.color.copy(c);
        m.material.emissive.copy(c).multiplyScalar(0.4);
      }
    }

    controls.update();
    renderer.render(scene, camera);
    labelRenderer.render(scene, camera);
  }
  applyTheme();
  loop();

  return { setProject, select, focusRow, setInset, recenter };
}

return { createScene };
})();

const $ = (s) => document.querySelector(s);
const STATUS_PT = {
  running: 'Executando',
  thinking: 'Pensando',
  waiting: 'Aguardando você',
  error: 'Erro no último passo',
  idle: 'Ocioso',
  ready: 'Pronto',
  done: 'Concluído',
  stale: 'Sem atividade',
  ended: 'Encerrado',
};
const STAGE_PT = { pending: 'Aguardando', active: 'Em andamento', done: 'Concluído', failed: 'Reprovado', stale: 'Sem atividade' };
const RUN_PT = { running: 'Em andamento', complete: 'Entregue', blocked: 'Bloqueado pelo QA', waiting: 'Aguardando próxima etapa' };

// sel: null | { type: 'agent', id } | { type: 'stage', sid, key }
const ui = { projects: [], details: {}, routes: null, selected: null, sel: null, focusSid: null, filter: '', mode: 'connecting' };

const scene = createScene($('#scene'), {
  onSelect: (s) => select(s == null ? null : typeof s === 'string' ? { type: 'agent', id: s } : { type: 'stage', ...s }),
  onFocusRow: (sid) => {
    ui.focusSid = sid;
    scene.focusRow(sid);
  },
});

// ------------------------------------------------------------------ data
let es = null;
function connectLive() {
  return new Promise((resolve) => {
    if (!location.protocol.startsWith('http')) return resolve(false);
    let opened = false;
    es = new EventSource('/api/stream');
    const timer = setTimeout(() => {
      if (!opened) {
        es.close();
        resolve(false);
      }
    }, 2500);
    es.addEventListener('update', (m) => {
      const d = JSON.parse(m.data);
      if (!opened) {
        opened = true;
        clearTimeout(timer);
        ui.mode = d.demo ? 'demo' : 'live';
        resolve(true);
      }
      ui.projects = d.projects;
      ui.routes = d.routes;
      Object.assign(ui.details, d.details);
      render();
    });
    es.onerror = () => {
      if (!opened) {
        clearTimeout(timer);
        es.close();
        resolve(false);
      } else setConn('Reconectando…', '');
    };
  });
}

let local = null;
function startLocalDemo() {
  if (local) return;
  es?.close();
  const state = createState();
  local = state;
  ui.mode = 'demo';
  startDemo((ev) => apply(state, ev), { speed: 1.2 });
  const pull = () => {
    const now = Date.now();
    ui.projects = listProjects(state, now);
    ui.routes = state.routes;
    for (const p of ui.projects) ui.details[p.id] = projectDetail(state, p.id, now);
    render();
  };
  pull();
  setInterval(pull, 500);
}

async function ensureDetail(id) {
  if (ui.details[id] || ui.mode !== 'live') return;
  try {
    const r = await fetch(`/api/projects/${encodeURIComponent(id)}`);
    if (r.ok) ui.details[id] = await r.json();
  } catch {}
}

// ------------------------------------------------------------------ helpers
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 10) return 'agora';
  if (s < 60) return `há ${s}s`;
  if (s < 3600) return `há ${Math.round(s / 60)} min`;
  return `há ${Math.round(s / 3600)} h`;
}
function dur(ms) {
  if (!ms || ms < 0) return '';
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  return m < 60 ? `${m} min ${s % 60}s` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function button(cls, onClick, ...children) {
  const b = el('button', cls);
  b.type = 'button';
  b.onclick = onClick;
  b.append(...children);
  return b;
}
function item(child) {
  const li = el('li');
  li.append(child);
  return li;
}
function setConn(text, cls) {
  const c = $('#conn');
  c.textContent = text;
  c.className = 'conn ' + cls;
}
function pipeBar(stages, compact) {
  const bar = el('div', 'pipe' + (compact ? ' compact' : ''));
  STAGES.forEach((def, i) => {
    const seg = el('span', `seg ${stages[i] || 'pending'}`);
    seg.append(el('i'), el('span', null, def.label));
    bar.append(seg);
  });
  return bar;
}
function runSummary(run) {
  if (!run) return 'Sem pipeline nesta sessão';
  if (run.status === 'complete') return 'Entregue no git';
  if (run.status === 'blocked') return 'QA reprovou, aguardando decisão';
  const s = run.stages.find((x) => x.key === run.current);
  return s ? `${s.label}: ${s.status === 'active' ? s.verb.toLowerCase() : 'próxima etapa'}` : RUN_PT[run.status];
}

// ------------------------------------------------------------------ render
function renderProjects() {
  const list = $('#projects');
  const focusId = document.activeElement?.dataset?.pid;
  const q = ui.filter.trim().toLowerCase();
  const items = ui.projects.filter((p) => !q || p.name.toLowerCase().includes(q) || p.root.toLowerCase().includes(q));
  list.replaceChildren();
  if (!ui.projects.length) {
    const li = el('li', 'empty');
    li.append(el('div', null, 'Nenhum agente trabalhando agora. Rode /agent-fleet-3d:pipeline com uma tarefa e o projeto aparece aqui assim que o Tech Lead começar.'));
    if (ui.mode !== 'demo') li.append(button(null, startLocalDemo, 'Ver demonstração'));
    list.append(li);
    return;
  }
  if (!items.length) {
    list.append(el('li', 'empty', `Nenhum projeto corresponde a “${ui.filter}”.`));
    return;
  }
  for (const p of items) {
    const li = el('li');
    const row = el('div', 'row');
    row.append(el('span', 'name', p.name), el('span', 'when', ago(p.last)));
    const status = p.pipe
      ? `${RUN_PT[p.pipe.status]}${p.pipe.reworks ? `, ${p.pipe.reworks} retrabalho${p.pipe.reworks > 1 ? 's' : ''}` : ''}`
      : `${p.counts.running + p.counts.thinking} de ${p.total} agentes ativos`;
    const b = button('project', () => selectProject(p.id), row, pipeBar(p.pipe?.stages || [], true), el('div', 'pstatus ' + (p.pipe?.status || ''), status), el('div', 'step', p.step || ''));
    b.setAttribute('aria-current', String(p.id === ui.selected));
    b.setAttribute('aria-label', `${p.name}: ${status}`);
    b.dataset.pid = p.id;
    li.append(b);
    list.append(li);
    if (p.id === focusId) b.focus();
  }
}

function renderStage() {
  const det = ui.selected ? ui.details[ui.selected] : null;
  $('#placeholder').hidden = !!det;
  $('#title').hidden = !det;
  $('#drawer').hidden = !det;
  $('#recenter').hidden = !det;
  scene.setProject(det);
  scene.setInset(det ? $('#drawer').offsetWidth + 24 : 0);
  if (!det) return;
  if (!ui.focusSid || !det.flows.some((f) => f.sid === ui.focusSid)) {
    ui.focusSid = det.flows[0]?.sid || null;
    scene.focusRow(ui.focusSid);
  }
  $('#p-name').textContent = det.name;
  $('#p-root').textContent = det.root;
  const chips = $('#p-chips');
  chips.replaceChildren();
  const c = { running: 0, complete: 0, blocked: 0, waiting: 0 };
  let reworks = 0;
  for (const f of det.flows) if (f.run) {
    c[f.run.status]++;
    reworks += f.run.reworks;
  }
  const chip = (cls, n, text) => {
    if (!n) return;
    const ch = el('span', `chip ${cls}`);
    ch.append(el('b', null, String(n)), document.createTextNode(' ' + text));
    chips.append(ch);
  };
  chip('running', c.running + c.waiting, c.running + c.waiting > 1 ? 'pipelines em andamento' : 'pipeline em andamento');
  chip('done', c.complete, c.complete > 1 ? 'entregues' : 'entregue');
  chip('error', c.blocked, c.blocked > 1 ? 'bloqueados pelo QA' : 'bloqueado pelo QA');
  chip('waiting', reworks, reworks > 1 ? 'retrabalhos' : 'retrabalho');
  if (!det.flows.some((f) => f.run)) chip('', det.flows.length, det.flows.length > 1 ? 'sessões sem pipeline' : 'sessão sem pipeline');
  renderDrawer(det);
}

function renderFlowCard(det, f) {
  const box = el('section', 'flow' + (f.sid === ui.focusSid ? ' focus' : ''));
  const head = button('flow-head', () => {
    ui.focusSid = f.sid;
    scene.focusRow(f.sid);
    render();
  });
  head.append(el('span', 'n', f.label), el('span', 'pstatus ' + (f.run?.status || ''), f.run ? RUN_PT[f.run.status] : STATUS_PT[f.status] || ''));
  box.append(head);
  if (f.run?.task) box.append(el('p', 'task', f.run.task));
  if (!f.run) {
    box.append(el('p', 'hint', 'Esta sessão não usou o pipeline. Rode /agent-fleet-3d:pipeline <tarefa> para passar uma tarefa pelas quatro etapas.'));
    box.append(el('p', 'hint', `Agora: ${f.step}`));
  } else {
    const ol = el('ol', 'stages');
    for (const s of f.run.stages) {
      const li = el('li');
      const meta = [STAGE_PT[s.status], s.dur && s.status !== 'pending' ? dur(s.dur) : null, s.attempts > 1 ? `${s.attempts} tentativas` : null].filter(Boolean).join(', ');
      const b = button(`stage-btn ${s.status}`, () => select({ type: 'stage', sid: f.sid, key: s.key }), el('span', 'dot'), el('span', 'n', s.label), el('span', 'm', meta));
      if (s.status === 'active') b.append(el('span', 's', s.step || ''));
      if (s.key === 'test' && s.verdict) b.append(el('span', 's ' + s.verdict, s.verdict === 'pass' ? 'Veredito: aprovado' : 'Veredito: reprovado'));
      if (s.key === 'ship' && s.status === 'done' && s.result) b.append(el('span', 's', s.result.split('\n').pop()));
      li.append(b);
      ol.append(li);
    }
    box.append(ol);
    if (f.run.reworks) box.append(el('p', 'hint', `O QA devolveu para o Engenheiro ${f.run.reworks} vez${f.run.reworks > 1 ? 'es' : ''}.`));
  }
  const others = f.others.map((id) => det.agents.find((a) => a.id === id)).filter(Boolean);
  if (others.length) {
    box.append(el('p', 'sub-h', 'Outros agentes'));
    const ul = el('ul', 'agents');
    for (const a of others) ul.append(item(button('agent-btn sub', () => select({ type: 'agent', id: a.id }), el('span', `dot ${a.status}`), el('span', 'n', a.label), el('span', 's', a.step))));
    box.append(ul);
  }
  return box;
}

function renderTimeline(a) {
  const dl = el('dl', 'facts');
  const fact = (k, v) => v != null && v !== '' && dl.append(el('dt', null, k), el('dd', null, String(v)));
  fact('Agente', a.kind === 'main' ? 'Sessão principal (orquestrador)' : a.type);
  fact('Estado', STATUS_PT[a.status] || a.status);
  fact('Skill', a.skill || 'nenhuma');
  fact('Ferramentas', a.tools);
  if (a.errors) fact('Erros', a.errors);
  fact('Início', ago(a.started));
  fact('Último evento', ago(a.last));
  if (a.result) fact('Resultado', a.result);
  const tl = el('ol', 'timeline');
  tl.setAttribute('aria-label', 'Passos, do mais recente ao mais antigo');
  for (const s of [...a.steps].reverse()) {
    const li = el('li', s.st);
    li.append(el('div', 't', s.step));
    const meta = [s.tool, ago(s.t), s.dur != null ? `${(s.dur / 1000).toFixed(s.dur < 10000 ? 1 : 0)}s` : s.st === 'running' ? 'em andamento' : null].filter(Boolean).join(', ');
    li.append(el('div', 'm', meta));
    if (s.err) li.append(el('div', 'err', s.err));
    tl.append(li);
  }
  return [dl, tl];
}

function renderDrawer(det) {
  const head = $('#d-head');
  const body = $('#d-body');
  head.replaceChildren();
  body.replaceChildren();
  const back = () => button('back', () => select(null), 'Voltar ao pipeline');

  if (ui.sel?.type === 'stage') {
    const f = det.flows.find((x) => x.sid === ui.sel.sid);
    const s = f?.run?.stages.find((x) => x.key === ui.sel.key);
    const def = STAGES.find((x) => x.key === ui.sel.key);
    head.append(back(), el('h3', null, def.label), el('p', null, `${def.verb}. ${s ? STAGE_PT[s.status] : 'Aguardando'}${s?.dur && s.status !== 'pending' ? `, ${dur(s.dur)}` : ''}.`));
    const a = s?.agentId && det.agents.find((x) => x.id === s.agentId);
    if (!a) {
      body.append(el('p', 'hint pad', 'Esta etapa ainda não começou. Ela inicia quando a etapa anterior terminar.'));
      return;
    }
    if (s.history?.length > 1) {
      body.append(el('p', 'sub-h pad', 'Tentativas'));
      const ul = el('ul', 'agents');
      s.history.forEach((h, i) => ul.append(item(button('agent-btn', () => select({ type: 'agent', id: h.id }), el('span', `dot ${h.verdict === 'fail' ? 'error' : h.status}`), el('span', 'n', `${i + 1}ª tentativa`), el('span', 's', h.verdict ? (h.verdict === 'pass' ? 'aprovado' : 'reprovado') : STATUS_PT[h.status] || '')))));
      body.append(ul);
    }
    body.append(...renderTimeline(a));
    return;
  }

  if (ui.sel?.type === 'agent') {
    const a = det.agents.find((x) => x.id === ui.sel.id);
    if (a) {
      head.append(back(), el('h3', null, a.label), el('p', null, `${STATUS_PT[a.status] || a.status}: ${a.step}`));
      body.append(...renderTimeline(a));
      return;
    }
  }

  head.append(el('h3', null, 'Pipeline'), el('p', null, 'Tech Lead planeja, Engenheiro implementa, QA testa e DevOps sobe para o git. Clique numa etapa para ver os passos.'));
  for (const f of det.flows) body.append(renderFlowCard(det, f));
}

function renderFooter() {
  if (ui.mode === 'live') setConn('Ao vivo', 'live');
  else if (ui.mode === 'demo') setConn('Demonstração', 'demo');
  const r = ui.routes;
  const box = $('#router-stats');
  box.replaceChildren();
  if (r && r.total) {
    const avg = r.injected ? Math.round(r.tokens / r.injected) : 0;
    box.append(document.createTextNode('Roteador de skills: '), el('strong', null, `${r.injected} de ${r.total}`), document.createTextNode(` prompts com skill, ~${avg} tokens por sugestão`));
  }
}

let raf = 0;
function render() {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    if (!ui.selected && ui.projects.length && matchMedia('(min-width: 901px)').matches) ui.selected = ui.projects[0].id;
    renderProjects();
    renderStage();
    renderFooter();
  });
}

async function selectProject(id) {
  ui.selected = id;
  ui.sel = null;
  ui.focusSid = null;
  scene.select(null);
  await ensureDetail(id);
  render();
}
function select(sel) {
  ui.sel = sel;
  const det = ui.details[ui.selected];
  let agentId = sel?.type === 'agent' ? sel.id : null;
  if (sel?.type === 'stage') {
    ui.focusSid = sel.sid;
    scene.focusRow(sel.sid);
    agentId = det?.flows.find((f) => f.sid === sel.sid)?.run?.stages.find((s) => s.key === sel.key)?.agentId || null;
  }
  if (sel?.type === 'agent' && det?.flows.some((f) => f.sid === sel.id)) {
    ui.focusSid = sel.id;
    scene.focusRow(sel.id);
  }
  scene.select(agentId);
  render();
}

$('#filter').addEventListener('input', (e) => {
  ui.filter = e.target.value;
  renderProjects();
});
$('#recenter').addEventListener('click', () => scene.recenter());
addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && ui.sel) select(null);
});

const params = new URLSearchParams(location.search);
if (true) startLocalDemo();
else if (!(await connectLive())) startLocalDemo();
setInterval(render, 5000); // keep relative times fresh
render();

</script>
